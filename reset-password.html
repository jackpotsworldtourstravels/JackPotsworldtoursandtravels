<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — JackPots World Tours &amp; Travels</title>
<link rel="icon" type="image/png" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2540; --navy-2:#123157; --gold:#FFB020; --gold-dark:#C98A0E;
  --white:#FFFFFF; --muted:#5B6B82; --line:rgba(10,37,64,0.12);
  --shadow-lg:0 30px 70px -20px rgba(10,37,64,0.35); --radius:22px; --ff:'Montserrat', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  font-family:var(--ff); color:var(--navy); -webkit-font-smoothing:antialiased;
  background:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 45%, #1B4577 100%);
  background-attachment:fixed;
}
button,input{font-family:var(--ff);}
button{cursor:pointer;}
a{color:inherit; text-decoration:none;}

.auth-card{
  background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow-lg);
  width:100%; max-width:420px; padding:40px 36px; position:relative; overflow:hidden;
}
.auth-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:5px;
  background:linear-gradient(90deg, var(--gold), var(--navy));
}
.auth-logo{display:block; height:56px; width:auto; margin:0 auto 22px; object-fit:contain;}
.auth-title{font-size:22px; font-weight:800; text-align:center; color:var(--navy);}
.auth-sub{font-size:13.5px; color:var(--muted); text-align:center; margin-top:8px; margin-bottom:26px; line-height:1.5;}

.field{margin-bottom:16px;}
.field label{display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--navy); margin-bottom:6px;}
.field input{
  width:100%; padding:13px 16px; border-radius:12px; border:1.5px solid var(--line);
  font-size:14.5px; color:var(--navy); outline:none; transition:border-color .2s ease;
}
.field input:focus{border-color:var(--gold-dark);}

.btn-primary{
  width:100%; padding:14px; border-radius:100px; border:none; background:var(--navy); color:#fff;
  font-weight:700; font-size:15px; margin-top:6px; transition:filter .2s ease, transform .2s ease;
}
.btn-primary:hover{filter:brightness(1.15);}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.5; cursor:not-allowed;}

.auth-switch{text-align:center; margin-top:24px; font-size:14px; color:var(--muted);}
.auth-switch a{color:var(--gold-dark); font-weight:700;}
.auth-switch a:hover{text-decoration:underline;}

.msg{margin-top:16px; font-size:13px; font-weight:600; text-align:center; line-height:1.6;}
.msg.error{color:#E63946;} .msg.success{color:#12B76A;}

.back-home{position:fixed; top:22px; left:24px; color:rgba(255,255,255,0.8); font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:6px;}
.back-home:hover{color:#fff;}
.back-home svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2;}
@media (max-width:480px){ .auth-card{padding:32px 24px;} .back-home{position:static; margin-bottom:16px; color:rgba(255,255,255,0.85);} body{display:block; padding:32px 16px;} }
</style>
</head>
<body>
<a href="login.html" class="back-home"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg> Back to login</a>

<div class="auth-card">
  <img class="auth-logo" src="assets/jackpots-logo-full.png" alt="JackPots World Tours &amp; Travels">
  <h1 class="auth-title">Reset Password</h1>
  <p class="auth-sub" id="resetSub">Enter a new password for your account.</p>

  <form id="resetForm" novalidate>
    <div class="field">
      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm New Password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <button type="submit" class="btn-primary" id="resetSubmitBtn">Reset Password</button>
    <div class="msg" id="resetMsg"></div>
  </form>

  <div class="auth-switch">Remembered your password? <a href="login.html">Back to Login</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
'use strict';
const API_BASE = ['localhost', '127.0.0.1'].includes(location.hostname) ? 'http://127.0.0.1:8000' : '';

const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  document.getElementById('resetSub').textContent = 'This reset link is missing its token — please request a new one.';
  document.getElementById('resetSub').style.color = '#E63946';
  document.getElementById('resetSubmitBtn').disabled = true;
}

document.getElementById('resetForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('resetMsg');
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (newPassword !== confirmPassword) {
    msg.textContent = "Passwords don't match — please try again.";
    msg.className = 'msg error';
    return;
  }
  try {
    await axios.post(`${API_BASE}/api/auth/reset-password`, { token, new_password: newPassword });
    msg.textContent = 'Password reset — redirecting to login…';
    msg.className = 'msg success';
    setTimeout(() => { window.location.href = 'login.html'; }, 1200);
  } catch (err) {
    msg.textContent = err.response?.data?.detail || 'Failed to reset password — the link may have expired.';
    msg.className = 'msg error';
  }
});
</script>
</body>
</html>
