<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JackPots UI Overhaul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
/* Tokens: brand palette from the prompt, confirmed against mobile-app/src/theme/tokens.ts */
:root{
  --navy:#0A1120;--navy800:#0F1B2E;--navy2:#22375A;--ivory:#F5F0E8;--ivory2:#EBE3D6;--white:#FFFFFF;
  --ink:#151B27;--ink2:#3B4252;--muted:#5F5B52;--faint:#9A958A;--line:#E4DCCD;--line2:#EFE9DE;
  --gold:#D9B26F;--coral:#C9482F;
  --ok:#1D7550;--okBg:#E3F2EA;--warn:#8A5A0E;--warnBg:#FBF0DC;--err:#9E2A24;--errBg:#F9E5E3;--info:#27578A;--infoBg:#E4EDF7;
  --shadow:0 2px 10px rgba(10,17,32,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D3CDC2;font-family:Montserrat,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gallery{display:flex;flex-wrap:wrap;gap:48px 32px;padding:40px;justify-content:center}
.gallery>figure{display:flex;flex-direction:column;gap:12px;align-items:center}
.gallery figcaption{font:600 13px Montserrat;color:#3B4252;max-width:390px;text-align:center}
.solo,.solo body{background:var(--ivory)}
.solo .gallery{padding:0;display:block}
.solo .gallery>figure{display:none}
.solo .gallery>figure.on{display:block}
.solo figcaption{display:none}
.solo .ph{border-radius:0;box-shadow:none}

/* phone shell */
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:var(--ivory);border-radius:36px;box-shadow:0 30px 60px rgba(10,17,32,.25)}
.ph.tall{height:auto}
.sb{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 32px;font:600 15px Montserrat;color:var(--ink);position:relative;z-index:5}
.sb.l{color:#fff}
.sb .r{display:flex;gap:6px;align-items:center}
.hb{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);z-index:60}
.hb.l{background:#fff}
.band{background:var(--navy);color:#fff}
.hdr{display:flex;align-items:center;gap:12px;padding:4px 16px 14px;min-height:52px}
.hdr .t{flex:1;min-width:0}
.hdr .t b{display:block;font:700 18px Montserrat}
.hdr .t span{display:block;font:500 12.5px Montserrat;opacity:.72;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .back{width:36px;height:36px;display:grid;place-items:center;margin-left:-6px}
.hdr .back svg.i{width:24px;height:24px}
.hdr .act{font:700 13px Montserrat;color:var(--gold)}
.hdr.w{background:var(--white);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.hdr.w .act{color:var(--navy2)}

/* tabs */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--white);box-shadow:0 -1px 0 var(--line);display:flex;padding:9px 4px 0;z-index:20}
.tall .tabbar{position:relative}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px Montserrat;color:#7B776D}
.tab svg.i{width:23px;height:23px}
.tab.on{color:var(--navy)}
.tab.on svg.i{stroke-width:2.2}
.tab.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.tab{position:relative}

/* primitives */
.card{background:var(--white);border-radius:12px;box-shadow:var(--shadow)}
.lbl{font:600 11px Montserrat;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cta{height:52px;border-radius:999px;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font:800 15px Montserrat;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 6px 14px rgba(201,72,47,.28)}
.cta.n{text-transform:none;letter-spacing:0}
.cta.off{background:#D9CFC2;box-shadow:none;color:#fff}
.btn2{height:46px;border-radius:999px;border:1.5px solid var(--navy2);color:var(--navy2);display:flex;align-items:center;justify-content:center;gap:8px;font:700 14px Montserrat}
.link{font:700 13px Montserrat;color:var(--navy2);display:inline-flex;align-items:center;gap:2px}
.link svg.i{width:16px;height:16px}
.seg{display:flex;background:var(--ivory2);border-radius:999px;padding:3px}
.seg div{flex:1;height:36px;border-radius:999px;display:grid;place-items:center;font:600 13px Montserrat;color:var(--ink2)}
.seg div.on{background:var(--navy);color:#fff;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;background:var(--white);box-shadow:inset 0 0 0 1px var(--line);font:600 12.5px Montserrat;color:var(--ink2);white-space:nowrap;flex:none}
.chip.on{background:var(--navy);box-shadow:none;color:#fff}
.chip svg.i{width:15px;height:15px}
.chips{display:flex;gap:8px;padding:12px 16px;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:var(--gold);color:var(--navy);font:700 11px Montserrat}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font:700 11.5px Montserrat}
.pill svg.i{width:13px;height:13px;stroke-width:2.4}
.pill.ok{background:var(--okBg);color:var(--ok)} .pill.warn{background:var(--warnBg);color:var(--warn)} .pill.info{background:var(--infoBg);color:var(--info)} .pill.navy{background:var(--navy);color:#fff}
.rate{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 7px;border-radius:6px;background:var(--ok);color:#fff;font:700 12px Montserrat}
.rate svg.i{width:11px;height:11px;fill:#fff;stroke:none}
.price{font:800 18px Montserrat;color:var(--ink)}
.price small{font:500 11.5px Montserrat;color:var(--muted)}
.mut{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.sec{display:flex;justify-content:space-between;align-items:center;padding:22px 16px 12px}
.sec h3{font:700 16px Montserrat}
.rail{display:flex;gap:12px;padding:0 16px;overflow:hidden}
.img{background:#CFC6B6 center/cover no-repeat;position:relative}
.destph::after{content:"Destination photo · not this hotel";position:absolute;left:8px;bottom:8px;background:rgba(10,17,32,.8);color:#fff;font:600 10px Montserrat;padding:4px 8px;border-radius:6px}
.destph.s::after{content:"City photo";font-size:9px;padding:3px 6px;left:6px;bottom:6px}
.heart{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--ink)}
.heart svg.i{width:17px;height:17px}
.heart.on{color:var(--coral)} .heart.on svg.i{fill:var(--coral)}
.preview{display:flex;align-items:center;gap:8px;margin:0 16px 12px;padding:9px 12px;border-radius:10px;background:var(--warnBg);color:var(--warn);font:700 11.5px/1.4 Montserrat;border:1.5px dashed #D9A752}
.preview svg.i{width:16px;height:16px}
.needs{display:inline-flex;align-items:center;font:700 9.5px Montserrat;letter-spacing:.06em;text-transform:uppercase;color:var(--info);border:1.5px dashed var(--info);border-radius:6px;padding:3px 6px;background:var(--infoBg)}
.note{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:var(--infoBg);color:var(--info);font:600 12px/1.45 Montserrat}
.note svg.i{width:16px;height:16px;margin-top:1px}

/* field cards */
.fc{padding:12px 14px;position:relative}
.fc .v{font:800 26px Montserrat;letter-spacing:.01em;margin-top:3px;line-height:1.1}
.fc .v.m{font-size:20px}
.fc .s{font:500 12px Montserrat;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split{display:flex}
.split>div{flex:1;min-width:0}
.split>div+div{border-left:1px solid var(--line2)}
.hr{height:1px;background:var(--line2)}
.swap{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--white);box-shadow:0 0 0 1px var(--line),var(--shadow);display:grid;place-items:center;color:var(--navy2);z-index:2}
.nights{position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:var(--navy);color:#fff;font:700 10.5px Montserrat;padding:4px 10px;border-radius:999px;white-space:nowrap}

/* bars */
.sf{position:absolute;left:12px;right:12px;bottom:34px;height:52px;border-radius:999px;background:var(--navy);display:flex;align-items:center;z-index:30;box-shadow:0 8px 20px rgba(10,17,32,.3)}
.sf div{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;color:#fff;font:700 13px Montserrat;height:24px}
.sf div+div{border-left:1px solid rgba(255,255,255,.2)}
.sf b{width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--navy);font:800 10.5px Montserrat;display:grid;place-items:center}
.foot{position:absolute;left:0;right:0;bottom:0;background:var(--white);box-shadow:0 -2px 12px rgba(10,17,32,.08);padding:12px 16px 32px;display:flex;align-items:center;gap:14px;z-index:30}
.foot .p{flex:1;min-width:0}
.foot .cta{padding:0 26px}
.dim{position:absolute;inset:0;background:rgba(6,10,18,.55);z-index:40}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--white);border-radius:20px 20px 0 0;z-index:50;padding:10px 20px 34px}
.grab{width:40px;height:5px;border-radius:3px;background:#D6CEC0;margin:0 auto 14px}
.sheet h4{font:700 18px Montserrat}
.stp{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line2)}
.stp b{display:block;font:700 15px Montserrat}
.stp span{font:500 12px Montserrat;color:var(--muted)}
.ctr{display:flex;align-items:center;gap:14px;font:800 16px Montserrat}
.ctr i{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--navy2);display:grid;place-items:center;color:var(--navy2)}
.ctr i.off{box-shadow:inset 0 0 0 1.5px var(--line);color:#C9C3B7}
.stabs{display:flex;gap:22px;background:var(--white);padding:0 16px;box-shadow:0 1px 0 var(--line)}
.stabs div{font:600 13.5px Montserrat;color:var(--muted);padding:14px 0 12px;position:relative;white-space:nowrap}
.stabs div.on{color:var(--navy);font-weight:700}
.stabs div.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--navy)}
.acc{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line2);font:700 14px Montserrat}
.acc svg.i{color:var(--muted)}
.ck{display:flex;gap:9px;align-items:flex-start;font:500 13px/1.45 Montserrat;color:var(--ink2);padding:3px 0}
.ck svg.i{width:16px;height:16px;color:var(--ok);stroke-width:2.6;margin-top:1px}
.amen{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font:500 12px Montserrat;color:var(--ink2)}
.amen span{display:flex;align-items:center;gap:5px}
.amen svg.i{width:15px;height:15px;color:var(--navy2)}
.input{height:52px;border-radius:12px;background:var(--white);box-shadow:inset 0 0 0 1px var(--line);padding:0 14px;display:flex;flex-direction:column;justify-content:center}
.input .lbl{font-size:10px}
.input b{font:600 15px Montserrat;margin-top:2px}
.input span.ph2{font:500 15px Montserrat;color:var(--faint);margin-top:2px}
.input.err{box-shadow:inset 0 0 0 1.5px var(--err)}
.errm{display:flex;align-items:center;gap:5px;font:600 12px Montserrat;color:var(--err);margin:6px 2px 0}
.errm svg.i{width:14px;height:14px}
.caret{display:inline-block;width:2px;height:20px;background:var(--coral);vertical-align:middle;margin-left:1px;animation:none}

/* keyboard */
.kb{position:absolute;left:0;right:0;bottom:0;height:291px;background:#D1D4DA;padding:8px 3px 0;z-index:35}
.kb .r{display:flex;justify-content:center;gap:6px;margin-bottom:11px}
.kb .k{width:32px;height:42px;border-radius:5px;background:#fff;box-shadow:0 1px 0 #8E9095;display:grid;place-items:center;font:400 22px -apple-system,Segoe UI,sans-serif;color:#000}
.kb .k.w{width:45px;background:#ABB0BA;font-size:15px}
.kb .k.sp{width:190px;font-size:15px}
.kb .k.go{width:88px;background:#ABB0BA;font-size:15px}
.kb.num .k{width:117px;height:46px;font-size:24px}
.kb.num .k.x{background:transparent;box-shadow:none}

/* home */
.hhead{display:flex;align-items:center;gap:10px;padding:2px 16px 0}
.mark{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--navy);box-shadow:0 0 0 1px rgba(217,178,111,.6);position:relative;flex:none}
.mark img{position:absolute;width:56px;left:-9px;top:-1px}
.wm b{display:block;font:700 15px Montserrat;color:#fff}
.wm span{display:block;font:700 8.5px Montserrat;letter-spacing:.24em;color:var(--gold);margin-top:1px}
.bell{position:relative;width:40px;height:40px;display:grid;place-items:center;color:#fff}
.bell::after{content:"";position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--navy)}
.svc{display:flex;padding:16px 6px 14px}
.svc>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;font:700 13px/1.2 Montserrat;color:var(--ink);text-align:center}
.svc>div+div{border-left:1px solid var(--line2)}
.svc i{width:56px;height:56px;border-radius:16px;background:var(--ivory);display:grid;place-items:center;color:var(--navy)}
.svc i svg.i{width:28px;height:28px;stroke-width:1.7}
.svc i.g{background:var(--navy);color:var(--gold)}
.sc{display:flex;padding:14px 4px}
.sc>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;font:600 11.5px/1.25 Montserrat;color:var(--ink2);text-align:center}
.sc i{width:44px;height:44px;border-radius:12px;background:var(--ivory);display:grid;place-items:center;color:var(--navy2)}
.sc svg.i{width:22px;height:22px}
.dc{width:116px;height:150px;border-radius:12px;flex:none;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.dc::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(6,10,18,.82))}
.dc b,.dc span{position:relative}
.dc b{font:700 14px Montserrat} .dc span{font:500 11px Montserrat;opacity:.85}
.hc{width:244px;flex:none;overflow:hidden}
.hc .img{height:132px}
.hc .b{padding:10px 12px 12px}
.hc h5{font:700 14.5px Montserrat;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc{display:flex;align-items:center;gap:4px;font:500 12px Montserrat;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden}
.loc svg.i{width:13px;height:13px}
.dur{position:absolute;left:8px;top:8px}

/* lists */
.lc{margin:0 16px 12px;overflow:hidden}
.lc .img{height:170px}
.lc .b{padding:12px 14px 14px}
.lc h5{font:700 16px Montserrat}
.fcard{margin:0 16px 10px;padding:14px}
.fl{display:flex;align-items:center;gap:9px;font:600 12.5px Montserrat;color:var(--ink2)}
.fl img{width:26px;height:26px;border-radius:6px;object-fit:contain;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.ft{display:flex;align-items:center;margin-top:11px}
.ft .t b{display:block;font:800 18px Montserrat}
.ft .t span{font:600 11.5px Montserrat;color:var(--muted)}
.ft .m{flex:1;text-align:center;font:600 11px Montserrat;color:var(--muted);padding:0 10px}
.ft .m i{display:block;height:1.5px;background:var(--line);margin:5px 0;position:relative}
.ft .m i::before,.ft .m i::after{content:"";position:absolute;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--navy2)}
.ft .m i::before{left:0}.ft .m i::after{right:0}
.dstrip{display:flex;background:var(--white);box-shadow:0 1px 0 var(--line)}
.dstrip div{flex:1;text-align:center;padding:10px 0 9px;font:600 11px Montserrat;color:var(--muted)}
.dstrip div b{display:block;font:800 15px Montserrat;color:var(--ink);margin-top:1px}
.dstrip div.on{background:var(--navy);color:rgba(255,255,255,.75)}
.dstrip div.on b{color:#fff}
.code{width:46px;height:34px;border-radius:8px;background:var(--ivory2);display:grid;place-items:center;font:800 13px Montserrat;color:var(--navy);flex:none}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);background:var(--white)}
.lrow b{display:block;font:700 14.5px Montserrat}
.lrow div>span{display:block;font:500 12px Montserrat;color:var(--muted);margin-top:2px}
.input[style*="flex-direction:row"]{justify-content:flex-start}
.gh{font:700 11px Montserrat;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 16px 8px}
.incl{display:flex;gap:16px;margin-top:10px}
.incl div{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 10.5px Montserrat;color:var(--ink2)}
.incl i{width:32px;height:32px;border-radius:50%;background:var(--ivory);display:grid;place-items:center;color:var(--navy2)}
.incl svg.i{width:16px;height:16px}

/* calendar */
.wk{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 10px;font:700 11px Montserrat;color:var(--muted);text-align:center;background:var(--white);box-shadow:0 1px 0 var(--line)}
.mon{padding:14px 10px 6px;background:var(--white)}
.mon h6{font:800 15px Montserrat;padding:0 8px 10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.days span{height:44px;display:grid;place-items:center;font:600 14px Montserrat;color:var(--ink);position:relative}
.days span.x{color:#C8C2B6}
.days span.in{background:var(--ivory2)}
.days span.a,.days span.z{color:#fff}
.days span.a::before,.days span.z::before{content:"";position:absolute;width:42px;height:42px;border-radius:50%;background:var(--navy);z-index:0}
.days span.a{background:linear-gradient(90deg,transparent 50%,var(--ivory2) 50%)}
.days span.z{background:linear-gradient(90deg,var(--ivory2) 50%,transparent 50%)}
.days span em{position:relative;z-index:1;font-style:normal}
.today{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--coral)}

/* timeline */
.tl{position:relative;padding-left:28px}
.tl .st{position:relative;padding-bottom:16px}
.tl .st::before{content:"";position:absolute;left:-19px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl .st:last-child::before{display:none}
.tl .st.d::before{background:var(--ok)}
.tl .st i{position:absolute;left:-28px;top:0;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);background:#fff;display:grid;place-items:center}
.tl .st.d i{background:var(--ok);box-shadow:none;color:#fff}
.tl .st.c i{box-shadow:inset 0 0 0 2px var(--navy2),0 0 0 4px var(--ivory2)}
.tl .st i svg.i{width:11px;height:11px;stroke-width:3.4}
.tl b{display:block;font:700 13.5px Montserrat}
.tl span{font:500 12px Montserrat;color:var(--muted)}
.day{display:flex;gap:12px}
.day .n{width:44px;flex:none;text-align:center}
.day .n b{display:block;width:44px;height:44px;border-radius:12px;background:var(--navy);color:#fff;font:800 11px/1.1 Montserrat;display:grid;place-items:center;text-align:center}

.shade::before{content:"";position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(rgba(6,10,18,.6),transparent)}
/* skeleton */
.sk{background:linear-gradient(90deg,#E9E2D6 0%,#F3EEE6 50%,#E9E2D6 100%);border-radius:8px}

/* chat */
.bub{max-width:78%;padding:10px 13px;border-radius:16px;font:500 13.5px/1.45 Montserrat}
.bub.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:5px}
.bub.th{align-self:flex-start;background:var(--white);box-shadow:var(--shadow);border-bottom-left-radius:5px}
.bub .tm{display:flex;justify-content:flex-end;align-items:center;gap:4px;font:600 10.5px Montserrat;margin-top:4px;opacity:.75}
.bub .tm svg.i{width:13px;height:13px;stroke-width:2.4}
.att{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;margin-top:7px}
.att i{width:34px;height:34px;border-radius:8px;background:var(--gold);color:var(--navy);display:grid;place-items:center}
.att svg.i{width:18px;height:18px}

/* splash / login */
.splash{height:100%;background:radial-gradient(120% 70% at 50% 38%,#1A2C49 0%,#0A1120 55%,#060A12 100%);display:flex;flex-direction:column;align-items:center}
.splash img{width:230px;margin-top:170px}
.otp{display:flex;gap:9px;justify-content:center}
.otp>span{width:46px;height:56px;border-radius:12px;background:var(--white);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font:800 24px Montserrat}
.otp>span.on{box-shadow:inset 0 0 0 2px var(--navy)}
</style>
</head>

<script>
/* Macros: <sb>, <hb>, <tabs a="..">, <kb>, and the two calendar months. Run before icons.js. */
const SB = '<span>9:41</span><span class="r"><svg viewBox="0 0 18 12" width="18" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 16 12" width="16" fill="currentColor"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .8C5.2.8 2.7 1.9.8 3.7L2 5c1.6-1.5 3.7-2.4 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4.4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.4a2 2 0 0 0-1.3.5L8 11.5l1.3-1.4A2 2 0 0 0 8 9.6Z"/></svg><svg viewBox="0 0 27 12" width="27" fill="currentColor"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="19" height="8" rx="1.6"/><rect x="24" y="4" width="2" height="4" rx="1" opacity=".45"/></svg></span>';
function swap(sel, fn){document.querySelectorAll(sel).forEach(e=>{const d=document.createElement('div');d.innerHTML=fn(e);const n=d.firstElementChild;e.replaceWith(n);});}
swap('sb', e=>`<div class="sb ${e.className}" style="${e.getAttribute('style')||''}">${SB}</div>`);
swap('hb', e=>`<div class="hb ${e.className}"></div>`);
const T=[['home','home','Home'],['explore','compass','Explore'],['bookings','ticket','Bookings'],['wishlist','heart','Wishlist'],['profile','user','Profile']];
swap('tabs', e=>`<div class="tabbar">${T.map(t=>`<div class="tab ${t[0]===e.getAttribute('a')?'on':''}"><ic n="${t[1]}"></ic>${t[2]}</div>`).join('')}</div>`);
swap('kb', ()=>{const r=s=>s.split('').map(c=>`<span class="k">${c}</span>`).join('');return `<div class="kb"><div class="r">${r('qwertyuiop')}</div><div class="r">${r('asdfghjkl')}</div><div class="r"><span class="k w">⇧</span>${r('zxcvbnm')}<span class="k w">⌫</span></div><div class="r"><span class="k w">123</span><span class="k sp">space</span><span class="k go">search</span></div></div>`;});
/* Nov 2026 starts on a Sunday; today is Mon 23 Nov; stay is 28 -> 30 Nov. Dec 2026 starts on a Tuesday. */
function month(id, lead, days, cls){const el=document.getElementById(id);if(!el)return;let h='';for(let i=0;i<lead;i++)h+='<span></span>';for(let d=1;d<=days;d++){const c=cls(d);h+=`<span class="${c}"><em>${d}</em>${(id==='nov'&&d===23)?'<i class="today"></i>':''}</span>`;}el.innerHTML=h;}
month('nov',0,30,d=>d<23?'x':d===28?'a':d===29?'in':d===30?'z':'');
month('dec',2,31,()=>'');
/* Sheets sit over the real search form of their flow, not an empty card. */
function behind(sheetFig, formFig){const t=document.querySelector(`figure[data-s="${sheetFig}"] .card`), f=document.querySelector(`figure[data-s="${formFig}"] .card`);if(t&&f){const c=f.cloneNode(true);t.replaceWith(c);}}
behind('07-travellers-sheet','05-flight-search');
behind('13-rooms-guests-sheet','10-hotel-search');
</script>
<script src="icons.js"></script>
