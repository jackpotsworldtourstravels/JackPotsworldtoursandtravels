<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JackPots App Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=block" rel="stylesheet">
<style>
/* Tokens: copied from mobile-app/src/theme/tokens.ts */
:root{
  --night:#060A12;--navy900:#0A1120;--navy800:#0F1B2E;--navy700:#16263F;--navy600:#22375A;
  --ivory:#F5F0E8;--sand:#EBE3D6;--paper:#FDFBF8;--white:#FFFFFF;--surface2:#F6F1E9;
  --ink:#151B27;--ink2:#3B4252;--muted:#686459;
  --fieldFill:#F6F5F2;--fieldLine:rgba(21,27,39,.14);--fieldLabel:#6B7280;--segFill:#F0EEE9;
  --line:#E4DCCD;--gold:#D9B26F;--goldLight:#F0D9A6;--goldInk:#85602A;
  --goldFill:rgba(217,178,111,.16);--goldRing:rgba(217,178,111,.75);
  --coral:#C9482F;--coralDark:#A63A24;--coralSoft:#FBEBE6;
  --success:#1D7550;--successSoft:#E3F2EA;--warning:#95600F;--warningSoft:#FBF0DC;
  --info:#27578A;--infoSoft:#E4EDF7;--danger:#A3302A;
  --r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --sh-sm:0 4px 10px rgba(10,17,32,.08);--sh-md:0 12px 28px rgba(10,17,32,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D9D4CB;font-family:Montserrat,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.disp{font-family:"Playfair Display",Georgia,serif;font-weight:700;letter-spacing:-.01em}

/* ---------- gallery ---------- */
.gallery{display:flex;flex-wrap:wrap;gap:48px 36px;padding:40px;justify-content:center}
.gallery>figure{display:flex;flex-direction:column;gap:12px;align-items:center}
.gallery figcaption{font:600 13px Montserrat;color:#3B4252;max-width:390px;text-align:center}
.solo body,.solo{background:var(--paper)}
.solo .gallery{padding:0;gap:0;display:block}
.solo .gallery>figure{display:none}
.solo .gallery>figure.on{display:block}
.solo figcaption{display:none}
.solo .phone{border-radius:0;box-shadow:none}

/* ---------- phone ---------- */
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--paper);border-radius:36px;box-shadow:0 30px 60px rgba(10,17,32,.25)}
.phone.tall{height:auto}
.scroll{position:absolute;inset:0;overflow:hidden}
.tall .scroll{position:static}
.sb{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 32px;font:600 15px Montserrat;color:var(--ink);position:relative;z-index:5}
.sb.light{color:#fff}
.sb .r{display:flex;gap:6px;align-items:center}
.sb svg{height:12px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:30}
.homebar.light{background:#fff}

/* app bar */
.appbar{display:flex;align-items:center;gap:12px;padding:6px 16px 12px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--white);border:1px solid var(--line);color:var(--ink);flex:none}
.iconbtn.glass{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:#fff;backdrop-filter:blur(6px)}
.iconbtn.solidw{background:rgba(255,255,255,.94);border:none;box-shadow:var(--sh-sm)}
.appbar .t{flex:1;min-width:0}
.appbar .t b{display:block;font:700 17px Montserrat}
.appbar .t span{display:block;font:500 12.5px Montserrat;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar.dark{background:var(--navy900);color:#fff}
.appbar.dark .t span{color:rgba(255,255,255,.66)}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(253,251,248,.97);border-top:1px solid var(--line);display:flex;padding:8px 6px 0;z-index:20}
.tall .tabbar{position:relative}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 10.5px Montserrat;color:#8A8578}
.tab svg.i{width:23px;height:23px}
.tab.on{color:var(--navy800)}
.tab.on svg{color:var(--navy800)}
.tab.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:1px}

/* bits */
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--white);font:600 12.5px Montserrat;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--navy800);border-color:var(--navy800);color:#fff}
.chip.gold{background:var(--goldFill);border-color:var(--goldRing);color:var(--goldInk)}
.chip svg.i{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font:700 11px Montserrat;letter-spacing:.02em}
.pill.ok{background:var(--successSoft);color:var(--success)}
.pill.warn{background:var(--warningSoft);color:var(--warning)}
.pill.info{background:var(--infoSoft);color:var(--info)}
.pill.gold{background:var(--goldFill);color:var(--goldInk)}
.pill.navy{background:var(--navy800);color:#fff}
.pill svg.i{width:13px;height:13px;stroke-width:2.4}
.btn{height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px Montserrat;border:none}
.btn.primary{background:var(--coral);color:#fff;box-shadow:0 8px 18px rgba(201,72,47,.28)}
.btn.outline{background:var(--white);color:var(--navy800);border:1.5px solid var(--navy800)}
.btn.ghost{background:transparent;color:var(--coral)}
.btn.sm{height:40px;font-size:13px;padding:0 18px}
.sec{padding:0 16px}
.sech{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px;margin:26px 0 12px}
.sech h3{font:700 18px Montserrat;color:var(--ink)}
.sech a{font:600 13px Montserrat;color:var(--goldInk);text-decoration:none;display:flex;align-items:center;gap:2px}
.sech a svg.i{width:16px;height:16px}
.hs{display:flex;gap:12px;padding:0 16px;overflow:hidden}
.muted{color:var(--muted)}
.price{font:700 18px Montserrat;color:var(--ink)}
.price small{font:500 11.5px Montserrat;color:var(--muted)}
.stars{display:inline-flex;gap:1px;color:var(--gold)}
.stars svg.i{width:12px;height:12px;fill:var(--gold);stroke:none}
.rating{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:6px;background:var(--navy800);color:#fff;font:700 12px Montserrat}
.rating svg.i{width:11px;height:11px;fill:var(--gold);stroke:none}
.card{background:var(--white);border-radius:var(--r-lg);box-shadow:var(--sh-sm);border:1px solid rgba(228,220,205,.7);overflow:hidden}
.img{background:var(--sand) center/cover no-repeat;position:relative}
.dim{position:absolute;inset:0;background:rgba(6,10,18,.52);z-index:40}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:28px 28px 0 0;z-index:50;padding:10px 20px 34px;box-shadow:0 -10px 30px rgba(10,17,32,.2)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D6CEC0;margin:0 auto 14px}
.sheet h4{font:700 19px Montserrat;margin-bottom:4px}
.lbl{font:700 10.5px Montserrat;letter-spacing:.09em;text-transform:uppercase;color:var(--fieldLabel)}
.needs{display:inline-flex;align-items:center;gap:5px;font:700 10px Montserrat;letter-spacing:.06em;text-transform:uppercase;color:var(--info);border:1.5px dashed var(--info);border-radius:6px;padding:3px 7px;background:var(--infoSoft)}
.preview{display:flex;align-items:center;gap:8px;margin:0 16px 12px;padding:9px 12px;border-radius:10px;background:var(--warningSoft);color:var(--warning);font:700 11.5px Montserrat;border:1.5px dashed #D9A752}
.preview svg.i{width:16px;height:16px}
.bottombar{position:absolute;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);padding:12px 16px 30px;display:flex;align-items:center;gap:14px;z-index:20;box-shadow:0 -6px 18px rgba(10,17,32,.06)}
.bottombar .p{flex:1}
.bottombar .btn{flex:none;padding:0 26px}

.destph::after{content:"Destination photo · not this hotel";position:absolute;left:10px;bottom:10px;background:rgba(10,17,32,.78);color:#fff;font:600 10.5px Montserrat;padding:5px 9px;border-radius:7px}
.th.destph::after,.thumb.destph::after{display:none}
.between a{white-space:nowrap}
/* ---------- home ---------- */
.hero{height:318px;position:relative;color:#fff;background:var(--navy900) center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,18,.62) 0%,rgba(6,10,18,.5) 45%,rgba(10,17,32,.92) 100%)}
.hero>*{position:relative}
.hhead{display:flex;align-items:center;gap:10px;padding:4px 16px 0}
.mark{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--navy900);border:1px solid rgba(217,178,111,.55);flex:none;position:relative}
.mark img{position:absolute;width:62px;left:-10px;top:-1px}
.wm b{display:block;font:700 16px "Playfair Display";letter-spacing:.01em;color:#fff}
.wm span{display:block;font:600 8.5px Montserrat;letter-spacing:.26em;color:var(--gold);margin-top:1px}
.hhead .sp{flex:1}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:1.5px solid var(--navy900)}
.htext{padding:26px 20px 0}
.htext h1{font:700 30px/1.1 "Playfair Display";letter-spacing:-.01em;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.htext h1 em{font-style:italic;color:var(--goldLight)}
.htext p{font:500 13.5px/1.5 Montserrat;color:rgba(255,255,255,.9);margin-top:8px;max-width:300px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.searchcard{margin:-74px 12px 0;position:relative;z-index:3;background:var(--white);border-radius:24px;box-shadow:var(--sh-md);border:1px solid rgba(217,178,111,.3);overflow:hidden}
.svc{display:flex;gap:6px;padding:6px;background:linear-gradient(180deg,#0B111D,#121B2D)}
.svc div{flex:1;height:62px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:600 12px Montserrat;color:rgba(255,255,255,.7);border:1.5px solid transparent}
.svc div svg.i{width:22px;height:22px}
.svc div.on{background:var(--goldFill);border-color:var(--goldRing);color:var(--goldLight)}
.form{padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:var(--segFill);border-radius:999px;padding:4px}
.seg div{flex:1;height:34px;border-radius:999px;display:grid;place-items:center;font:600 12.5px Montserrat;color:var(--ink2)}
.seg div.on{background:var(--white);color:var(--navy800);box-shadow:0 2px 6px rgba(10,17,32,.12);font-weight:700}
.fld{background:var(--fieldFill);border:1px solid var(--fieldLine);border-radius:14px;padding:10px 14px;position:relative}
.fld .v{font:700 17px Montserrat;color:var(--ink);margin-top:4px;display:flex;align-items:baseline;gap:8px}
.fld .v small{font:500 12px Montserrat;color:var(--muted)}
.fld .s{font:500 12px Montserrat;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld.big .v{font-size:24px;letter-spacing:.02em}
.fld .add{font:600 13.5px Montserrat;color:var(--goldInk);margin-top:6px;display:flex;align-items:center;gap:4px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.ft{position:relative;display:flex;flex-direction:column;gap:8px}
.swap{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:var(--white);border:1.5px solid var(--goldRing);display:grid;place-items:center;color:var(--goldInk);box-shadow:var(--sh-sm);z-index:2}
.swap svg.i{transform:rotate(90deg)}
.nights{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--navy800);color:#fff;font:700 10.5px Montserrat;padding:4px 9px;border-radius:999px;z-index:2;white-space:nowrap}
.quick{display:flex;justify-content:space-between;padding:0 16px}
.quick div{width:64px;display:flex;flex-direction:column;align-items:center;gap:7px;font:600 11px/1.25 Montserrat;color:var(--ink2);text-align:center}
.quick i{width:54px;height:54px;border-radius:18px;background:var(--ivory);border:1px solid var(--line);display:grid;place-items:center;color:var(--navy800)}
.quick i svg.i{width:23px;height:23px}
.dcard{width:132px;height:176px;border-radius:18px;flex:none;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;overflow:hidden}
.dcard::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(6,10,18,.8))}
.dcard b,.dcard span{position:relative}
.dcard b{font:700 15px Montserrat}
.dcard span{font:500 11px Montserrat;color:rgba(255,255,255,.8);margin-top:2px}
.hcard{width:262px;flex:none}
.hcard .img{height:148px}
.hcard .b{padding:12px 14px 14px}
.hcard h5,.pcard h5{font:700 15.5px Montserrat;margin-bottom:4px}
.loc{display:flex;align-items:center;gap:4px;font:500 12px Montserrat;color:var(--muted)}
.loc svg.i{width:14px;height:14px}
.heart{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink)}
.heart svg.i{width:18px;height:18px}
.heart.on{color:var(--coral)}
.heart.on svg.i{fill:var(--coral)}
.pcard{width:240px;flex:none}
.pcard .img{height:150px}
.pcard .b{padding:12px 14px 14px}
.dur{position:absolute;left:10px;bottom:10px;background:rgba(10,17,32,.82);color:#fff;font:700 11px Montserrat;padding:5px 9px;border-radius:8px}
.between{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}

/* ---------- lists ---------- */
.lcard{margin:0 16px 14px}
.lcard .img{height:176px}
.lcard .b{padding:13px 14px 14px}
.amen{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 2px}
.amen span{font:600 11px Montserrat;color:var(--ink2);background:var(--surface2);border-radius:6px;padding:4px 8px}
.free{font:600 12px Montserrat;color:var(--success);display:flex;align-items:center;gap:4px;margin-top:8px}
.free svg.i{width:14px;height:14px;stroke-width:2.4}
.toolbar{display:flex;gap:8px;padding:0 16px 12px;overflow:hidden}
.note{display:flex;gap:8px;align-items:flex-start;margin:0 16px 12px;padding:10px 12px;border-radius:12px;background:var(--infoSoft);color:var(--info);font:600 11.5px/1.45 Montserrat}
.note svg.i{width:16px;height:16px;margin-top:1px}

/* flight */
.fcard{margin:0 16px 12px;padding:14px}
.fl{display:flex;align-items:center;gap:10px}
.fl img{width:30px;height:30px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.fl .n{font:600 12.5px Montserrat;color:var(--ink2);flex:1}
.ft2{display:flex;align-items:center;margin-top:12px}
.ft2 .tm b{display:block;font:700 19px Montserrat}
.ft2 .tm span{font:600 11.5px Montserrat;color:var(--muted)}
.ft2 .mid{flex:1;text-align:center;font:600 11px Montserrat;color:var(--muted);padding:0 10px}
.ft2 .mid i{display:block;height:1.5px;background:var(--line);margin:5px 0;position:relative}
.ft2 .mid i::after{content:"";position:absolute;right:-2px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.fbot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.dates{display:flex;gap:8px;padding:12px 16px;background:var(--navy900);overflow:hidden}
.dates div{flex:none;width:72px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font:600 11px Montserrat;border:1px solid rgba(255,255,255,.12)}
.dates div b{font:700 15px Montserrat;color:#fff}
.dates div.on{background:var(--goldFill);border-color:var(--goldRing);color:var(--goldLight)}

/* detail */
.dhero{height:300px;position:relative}
.dhero.destph::after{bottom:38px;left:16px}
.dhero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,18,.45),transparent 35%)}
.dhero .tb{position:absolute;top:47px;left:16px;right:16px;display:flex;gap:10px;z-index:2}
.dhero .tb .sp{flex:1}
.dbody{margin-top:-26px;position:relative;background:var(--paper);border-radius:26px 26px 0 0;padding:20px 16px 0}
.dbody h2{font:700 26px/1.15 "Playfair Display"}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:18px -16px 16px;padding:0 16px}
.tabs div{font:600 13.5px Montserrat;color:var(--muted);padding:0 0 11px;position:relative;white-space:nowrap}
.tabs div.on{color:var(--ink);font-weight:700}
.tabs div.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px;background:var(--gold)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.agrid div{display:flex;align-items:center;gap:10px;font:600 13px Montserrat;color:var(--ink2);background:var(--white);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.agrid svg.i{color:var(--goldInk)}
.ptext{font:500 13.5px/1.6 Montserrat;color:var(--ink2)}
.h6{font:700 15px Montserrat;margin:20px 0 10px}
.box{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px}
.ck{display:flex;gap:10px;align-items:flex-start;font:500 13.5px/1.45 Montserrat;color:var(--ink2);padding:5px 0}
.ck svg.i{width:18px;height:18px;color:var(--success);stroke-width:2.4;margin-top:1px}

/* room */
.room{margin:0 16px 14px;padding:14px;border:1.5px solid var(--line);box-shadow:none}
.room.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--goldFill)}
.room h5{font:700 16px Montserrat}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px Montserrat;color:var(--muted);margin:6px 0 10px}
.meta span{display:flex;align-items:center;gap:4px}
.meta svg.i{width:14px;height:14px}

/* steps */
.steps{display:flex;align-items:center;gap:8px;padding:0 16px 14px}
.steps .s{display:flex;align-items:center;gap:6px;font:600 12px Montserrat;color:var(--muted)}
.steps .s i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font:700 11px Montserrat;font-style:normal}
.steps .s.done i{background:var(--success);border-color:var(--success);color:#fff}
.steps .s.done i svg.i{width:13px;height:13px;stroke-width:3}
.steps .s.on{color:var(--ink)}
.steps .s.on i{border-color:var(--navy800);background:var(--navy800);color:#fff}
.steps .ln{flex:1;height:1.5px;background:var(--line)}
.qline{display:flex;justify-content:space-between;font:500 13.5px Montserrat;color:var(--ink2);padding:6px 0}
.qline.tot{font:700 16px Montserrat;color:var(--ink);border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.input{height:50px;border:1px solid var(--fieldLine);background:var(--white);border-radius:12px;padding:0 14px;display:flex;flex-direction:column;justify-content:center}
.input .lbl{font-size:9.5px}
.input span{font:500 14px Montserrat;color:#A19C92}
.input b{font:600 14px Montserrat;color:var(--ink)}

/* bookings */
.bk{margin:0 16px 14px}
.bk .top{display:flex;gap:12px;padding:14px}
.bk .th{width:74px;height:74px;border-radius:14px;flex:none}
.bk .kind{font:700 10px Montserrat;letter-spacing:.09em;text-transform:uppercase;color:var(--goldInk)}
.bk h5{font:700 15.5px Montserrat;margin:3px 0}
.bk .foot{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-top:1px solid var(--line);background:var(--surface2)}
.tl{position:relative;padding-left:30px}
.tl .st{position:relative;padding-bottom:18px}
.tl .st::before{content:"";position:absolute;left:-21px;top:20px;bottom:-2px;width:2px;background:var(--line)}
.tl .st:last-child::before{display:none}
.tl .st.done::before{background:var(--success)}
.tl .st i{position:absolute;left:-30px;top:0;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--white);display:grid;place-items:center}
.tl .st.done i{background:var(--success);border-color:var(--success);color:#fff}
.tl .st.cur i{border-color:var(--gold);box-shadow:0 0 0 4px var(--goldFill)}
.tl .st i svg.i{width:11px;height:11px;stroke-width:3.4}
.tl b{display:block;font:700 13.5px Montserrat}
.tl span{font:500 12px Montserrat;color:var(--muted)}

/* profile */
.prof{background:linear-gradient(160deg,var(--navy900),var(--navy700));color:#fff;padding:4px 20px 24px}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#F0D9A6,#B98A42);color:var(--navy900);display:grid;place-items:center;font:700 22px "Playfair Display";flex:none}
.list{margin:0 16px;background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:13px;padding:0 14px;height:56px;border-bottom:1px solid #EFE9DE;font:600 14px Montserrat;color:var(--ink)}
.li:last-child{border-bottom:none}
.li i{width:36px;height:36px;border-radius:11px;background:var(--ivory);display:grid;place-items:center;color:var(--navy800);flex:none}
.li i svg.i{width:19px;height:19px}
.li .x{flex:1}
.li .chev{color:#B3AC9F}
.gl{font:700 11px Montserrat;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:20px 20px 9px}

/* chat */
.chat{padding:8px 16px 0;display:flex;flex-direction:column;gap:10px}
.bub{max-width:78%;padding:11px 14px;border-radius:18px;font:500 13.5px/1.45 Montserrat}
.bub.me{align-self:flex-end;background:var(--navy800);color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--white);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:6px}
.bub .tm{display:flex;justify-content:flex-end;align-items:center;gap:4px;font:600 10.5px Montserrat;margin-top:5px;opacity:.7}
.bub .tm svg.i{width:14px;height:14px;stroke-width:2.4;color:var(--goldLight)}
.file{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:12px;padding:10px}
.file i{width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--navy900);display:grid;place-items:center}
.dayc{align-self:center;font:700 10.5px Montserrat;letter-spacing:.06em;color:var(--muted);background:var(--sand);padding:4px 10px;border-radius:999px}
.composer{position:absolute;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);padding:10px 12px 32px;display:flex;align-items:center;gap:10px}
.composer .in{flex:1;height:44px;border-radius:22px;background:var(--fieldFill);border:1px solid var(--fieldLine);display:flex;align-items:center;padding:0 16px;font:500 14px Montserrat;color:#A19C92}
.send{width:44px;height:44px;border-radius:50%;background:var(--coral);display:grid;place-items:center;color:#fff}

/* splash */
.splash{background:radial-gradient(120% 70% at 50% 38%,#1A2C49 0%,#0A1120 55%,#060A12 100%);height:100%;display:flex;flex-direction:column;align-items:center;color:#fff}
.splash img{width:232px;margin-top:220px}
.loader{width:120px;height:3px;border-radius:2px;background:rgba(217,178,111,.2);margin-top:54px;overflow:hidden}
.loader i{display:block;width:45%;height:100%;background:var(--gold);border-radius:2px}
.splash p{margin-top:auto;margin-bottom:56px;font:500 12px Montserrat;letter-spacing:.22em;text-transform:uppercase;color:rgba(240,217,166,.75)}

/* stepper / toggles */
.stp{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #EFE9DE}
.stp b{display:block;font:700 15px Montserrat}
.stp span{font:500 12px Montserrat;color:var(--muted)}
.ctr{display:flex;align-items:center;gap:14px;font:700 16px Montserrat}
.ctr i{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--navy800)}
.ctr i.on{border-color:var(--navy800)}
.ctr i.off{color:#C9C3B7}
.opt{display:flex;align-items:center;gap:12px;padding:10px 0;font:600 14px Montserrat;color:var(--ink2)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #C9C3B7;flex:none}
.radio.on{border:6px solid var(--navy800)}
.box2{width:20px;height:20px;border-radius:6px;border:2px solid #C9C3B7;flex:none;display:grid;place-items:center}
.box2.on{background:var(--navy800);border-color:var(--navy800);color:#fff}
.box2 svg.i{width:13px;height:13px;stroke-width:3.2}
.toggle{width:46px;height:28px;border-radius:14px;background:var(--success);position:relative;flex:none}
.toggle::after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff}
.range{position:relative;height:28px;margin:6px 4px}
.range::before{content:"";position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--line)}
.range i{position:absolute;top:12px;height:4px;background:var(--navy800);left:12%;right:30%}
.range b{position:absolute;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--navy800);box-shadow:var(--sh-sm)}
</style>
</head>

<script>
// status bars
const sbHTML = document.getElementById('sb-dark').innerHTML;
document.querySelectorAll('[data-sb]').forEach(el=>{el.innerHTML=sbHTML.replace('<div class="sb">','').replace(/<\/div>$/,'');el.classList.add('sb','light');});
document.querySelectorAll('[data-sb-dark]').forEach(el=>{el.innerHTML=sbHTML.replace('<div class="sb">','').replace(/<\/div>$/,'');});
// icon wrapper: <svg class="i"><use href="#x"/></svg> needs viewBox
document.querySelectorAll('svg.i').forEach(s=>s.setAttribute('viewBox','0 0 24 24'));
// ?s=<id> shows one screen only (used to render the PNGs)
const s = new URLSearchParams(location.search).get('s');
