<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Create account</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1D35}a:hover{color:#13294A}
input::placeholder{color:#8A94A6}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07111F; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden">
<div style="height: 200px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding-top: 14px; box-sizing: border-box">
<img src="../assets/e26196549ea1fa8342da020aae51046f.png" alt="JackpotsWorld Tours &amp; Travels" style="width: 160px; height: auto; display: block">
</div>
<form style="flex-grow: 1; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 26px 24px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; margin: 0">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800; color: #0E1726; letter-spacing: -0.3px">Create your account</h1>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #5B6577">Book faster and keep every trip in one place.</p>
</div>
<label style="display: flex; flex-direction: column; gap: 5px">
<span style="font-size: 13px; font-weight: 600; color: #344054">Full name</span>
<input type="text" value="Asha Rao" style="height: 50px; border: 1.5px solid #D0D5DD; border-radius: 14px; padding: 0 14px; font: 500 15px 'Plus Jakarta Sans', sans-serif; color: #0E1726; box-sizing: border-box; outline: 0">
</label>
<label style="display: flex; flex-direction: column; gap: 5px">
<span style="font-size: 13px; font-weight: 600; color: #344054">Email</span>
<input type="email" value="asha@example.com" style="height: 50px; border: 1.5px solid #D0D5DD; border-radius: 14px; padding: 0 14px; font: 500 15px 'Plus Jakarta Sans', sans-serif; color: #0E1726; box-sizing: border-box; outline: 0">
</label>
<label style="display: flex; flex-direction: column; gap: 5px">
<span style="font-size: 13px; font-weight: 600; color: #344054">Mobile number</span>
<span style="height: 50px; border: 1.5px solid #0B1D35; border-radius: 14px; display: flex; align-items: center; box-sizing: border-box; overflow: hidden">
<span style="height: 100%; display: flex; align-items: center; padding: 0 12px; background: #F2F4F7; font-size: 15px; font-weight: 700; color: #344054; border-right: 1px solid #D0D5DD">+91</span>
<input type="tel" placeholder="98765 43210" aria-label="Mobile number" style="border: 0; outline: 0; flex-grow: 1; padding: 0 12px; font: 500 15px 'Plus Jakarta Sans', sans-serif; color: #0E1726; min-width: 0; height: 100%">
</span>
</label>
<label style="display: flex; flex-direction: column; gap: 5px">
<span style="font-size: 13px; font-weight: 600; color: #344054">Password</span>
<input type="password" placeholder="At least 8 characters" style="height: 50px; border: 1.5px solid #D0D5DD; border-radius: 14px; padding: 0 14px; font: 500 15px 'Plus Jakarta Sans', sans-serif; color: #0E1726; box-sizing: border-box; outline: 0">
</label>
<label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 19px; color: #5B6577; cursor: pointer">
<input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #0B1D35; flex-shrink: 0">
<span>I agree to the <a href="#terms" style="font-weight: 700; color: #0B1D35">Terms</a> and <a href="#privacy" style="font-weight: 700; color: #0B1D35">Privacy Policy</a></span>
</label>
<div style="flex-grow: 1"></div>
<a href="Verify.html" style="height: 54px; border-radius: 14px; background: #0B1D35; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">Create account</a>
<p style="margin: 0; text-align: center; font-size: 14px; color: #5B6577">Already have an account? <a href="Login.html" style="font-weight: 800; color: #8A6A1F; text-decoration: none">Log in</a></p>
</form>
</div>
</body>
</html>
