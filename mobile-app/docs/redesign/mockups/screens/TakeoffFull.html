<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Option B: take-off loader while searching</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E9CD85}a:hover{color:#F3DDA3}
@keyframes jw-takeoff{0%{transform:translate(-80px,0) rotate(0deg);opacity:0}8%{opacity:1}50%{transform:translate(-5px,0) rotate(0deg)}62%{transform:translate(22px,-4px) rotate(-10deg)}85%{transform:translate(70px,-38px) rotate(-16deg);opacity:1}100%{transform:translate(100px,-60px) rotate(-16deg);opacity:0}}
@keyframes jw-shadow{0%{transform:translate(-80px,0) scale(1);opacity:0}8%{opacity:.4}50%{transform:translate(-5px,0) scale(1);opacity:.4}62%{transform:translate(22px,0) scale(.75);opacity:.25}85%{transform:translate(55px,0) scale(.3);opacity:0}100%{opacity:0}}
@keyframes jw-runway{to{stroke-dashoffset:36}}
@keyframes jw-lights{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes jw-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body>

<g fill="#D4AF5A">
<circle cx="20" cy="108" r="1.3" style="animation: jw-lights 1.3s ease-in-out infinite"></circle>
<circle cx="52" cy="108" r="1.3" style="animation: jw-lights 1.3s ease-in-out 0.15s infinite"></circle>
<circle cx="84" cy="108" r="1.3" style="animation: jw-lights 1.3s ease-in-out 0.3s infinite"></circle>

<circle cx="148" cy="108" r="1.3" style="animation: jw-lights 1.3s ease-in-out 0.6s infinite"></circle>

<g style="transform-origin: 100px 88px; animation: jw-takeoff 2.6s cubic-bezier(.45,0,.55,1) infinite">
<g transform="translate(76 77)">
<path d="M4 8 L2 1 L7 1 L12 8 Z" fill="#B48A2E"></path>
<path d="M4 11 L1 15 L4 15 L9 11 Z" fill="#B48A2E"></path>
<path d="M2 11 C2 9 4 8 7 8 L38 8 C43 8 47 9.5 47 11 C47 12.5 43 14 38 14 L7 14 C4 14 2 13 2 11 Z" fill="#E9CD85"></path>

<circle cx="13" cy="15.6" r="1.4" fill="#7A5C16"></circle>
<circle cx="36" cy="15.6" r="1.4" fill="#7A5C16"></circle>
</g>
</g>
</svg>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<h1 style="margin: 0; font-size: 21px; line-height: 27px; font-weight: 800; color: #FFFFFF">Finding the best stays in Hyderabad</h1>

</div>
