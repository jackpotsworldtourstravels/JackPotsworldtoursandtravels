<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Flight: special assistance</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1D35}a:hover{color:#13294A}
textarea::placeholder{color:#8A94A6}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F9; position: relative; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column">
<header style="background: #FFFFFF; padding: 10px 12px 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #EAECF0; flex-shrink: 0">
<a href="AddOns.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 1px">
<h1 style="margin: 0; font-size: 18px; font-weight: 800; color: #0E1726">Special assistance</h1>
<p style="margin: 0; font-size: 12px; color: #5B6577">Free · arranged with the airline</p>
</div>
</header>
<div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px">
<label style="display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #FFFFFF; border-radius: 14px; padding: 0 14px; height: 50px">
<span style="font-size: 13px; font-weight: 600; color: #5B6577">For</span>
<select aria-label="Traveller" style="flex-grow: 1; border: 0; background: transparent; font: 800 15px 'Plus Jakarta Sans', sans-serif; color: #0E1726; text-align: right; outline: 0">
<option selected>Asha Rao</option>
<option>Ravi Rao</option>
</select>
</label>
<section style="background: #FFFCF4; border: 2px solid #D4AF5A; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; align-items: flex-start; gap: 12px; cursor: pointer">
<input type="checkbox" checked style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #0B1D35; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 800; color: #0E1726">Wheelchair</span>
<span style="font-size: 12px; color: #5B6577">Help through the airport and onto the aircraft</span>
</span>
</label>
<fieldset style="border: 0; margin: 0 0 0 32px; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 12px; font-weight: 700; color: #344054; margin-bottom: 8px; padding: 0">How much help does Asha need?</legend>
<label style="display: flex; align-items: flex-start; gap: 10px; background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 12px; padding: 10px; cursor: pointer">
<input type="radio" name="wch" style="width: 18px; height: 18px; margin: 1px 0 0; accent-color: #0B1D35; flex-shrink: 0">
<span style="font-size: 13px; line-height: 18px; color: #0E1726">Can walk to the seat, but not long distances</span>
</label>
<label style="display: flex; align-items: flex-start; gap: 10px; background: #FFFFFF; border: 1.5px solid #0B1D35; border-radius: 12px; padding: 10px; cursor: pointer">
<input type="radio" name="wch" checked style="width: 18px; height: 18px; margin: 1px 0 0; accent-color: #0B1D35; flex-shrink: 0">
<span style="font-size: 13px; line-height: 18px; color: #0E1726; font-weight: 700">Can’t manage steps, can walk inside the cabin</span>
</label>
<label style="display: flex; align-items: flex-start; gap: 10px; background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 12px; padding: 10px; cursor: pointer">
<input type="radio" name="wch" style="width: 18px; height: 18px; margin: 1px 0 0; accent-color: #0B1D35; flex-shrink: 0">
<span style="font-size: 13px; line-height: 18px; color: #0E1726">Needs help all the way to the seat</span>
</label>
</fieldset>
</section>
<div style="background: #FFFFFF; border-radius: 18px; overflow: hidden">
<label style="display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px; border-bottom: 1px solid #EAECF0; cursor: pointer">
<input type="checkbox" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #0B1D35; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800; color: #0E1726">Bringing my own wheelchair or mobility aid</span><span style="font-size: 12px; color: #5B6577">Carried free; tell us the type and battery</span></span>
</label>
<label style="display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px; border-bottom: 1px solid #EAECF0; cursor: pointer">
<input type="checkbox" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #0B1D35; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800; color: #0E1726">Vision or hearing impairment</span><span style="font-size: 12px; color: #5B6577">Guidance at the airport and on board</span></span>
</label>
<label style="display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px; border-bottom: 1px solid #EAECF0; cursor: pointer">
<input type="checkbox" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #0B1D35; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800; color: #0E1726">Medical condition or equipment</span><span style="font-size: 12px; color: #5B6577">Such as oxygen. Needs airline clearance; we’ll call you</span></span>
</label>
<label style="display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px; cursor: pointer">
<input type="checkbox" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #0B1D35; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800; color: #0E1726">Travelling with an infant</span><span style="font-size: 12px; color: #5B6577">Ask for a bassinet seat where the aircraft has one</span></span>
</label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700; color: #344054; padding: 0 4px">Anything else the airline should know?</span>
<textarea rows="2" placeholder="Optional" style="border: 1.5px solid #D0D5DD; border-radius: 14px; padding: 12px; font: 500 14px 'Plus Jakarta Sans', sans-serif; color: #0E1726; resize: none; outline: 0; background: #FFFFFF"></textarea>
</label>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #EAECF0; box-shadow: 0 -8px 24px rgba(7,17,31,0.08); padding: 12px 18px 20px; display: flex; flex-direction: column; gap: 8px">
<a href="AddOns.html" style="height: 52px; border-radius: 14px; background: #0B1D35; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Save request</a>
<p style="margin: 0; text-align: center; font-size: 12px; line-height: 17px; color: #5B6577">We send this to the airline and confirm by email.</p>
</div>
</div>
</body>
</html>
