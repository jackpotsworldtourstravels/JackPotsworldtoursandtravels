<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Add a passenger</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1D35}a:hover{color:#13294A}
input::placeholder{color:#8A94A6}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F9; position: relative; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column">
<header style="background: #FFFFFF; padding: 10px 12px 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #EAECF0; flex-shrink: 0">
<a href="SavedTravellers.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 1px">
<h1 style="margin: 0; font-size: 18px; font-weight: 800; color: #0E1726">Add a passenger</h1>
<p style="margin: 0; font-size: 12px; color: #5B6577">Enter details exactly as on their ID</p>
</div>
</header>
<form style="padding: 12px 16px 150px; display: flex; flex-direction: column; gap: 10px; margin: 0; flex: 1 1 auto; min-height: 0; overflow-y: auto">
<div role="radiogroup" aria-label="Passenger type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" role="radio" aria-checked="true" style="height: 52px; border-radius: 14px; border: 2px solid #0B1D35; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer"><span style="font: 800 14px 'Plus Jakarta Sans', sans-serif; color: #0B1D35">Adult</span><span style="font: 500 11px 'Plus Jakarta Sans', sans-serif; color: #5B6577">12+ years</span></button>
<button type="button" role="radio" aria-checked="false" style="height: 52px; border-radius: 14px; border: 1px solid #D0D5DD; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer"><span style="font: 700 14px 'Plus Jakarta Sans', sans-serif; color: #344054">Child</span><span style="font: 500 11px 'Plus Jakarta Sans', sans-serif; color: #5B6577">2–11 years</span></button>
<button type="button" role="radio" aria-checked="false" style="height: 52px; border-radius: 14px; border: 1px solid #D0D5DD; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer"><span style="font: 700 14px 'Plus Jakarta Sans', sans-serif; color: #344054">Infant</span><span style="font: 500 11px 'Plus Jakarta Sans', sans-serif; color: #5B6577">Under 2</span></button>
</div>
<section style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 800; color: #0E1726">Name and details</h2>
<div role="radiogroup" aria-label="Title" style="display: flex; gap: 8px">
<button type="button" role="radio" aria-checked="false" style="height: 38px; flex: 1 1 0; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; font: 700 13px 'Plus Jakarta Sans', sans-serif; color: #344054; cursor: pointer">Mr</button>
<button type="button" role="radio" aria-checked="false" style="height: 38px; flex: 1 1 0; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; font: 700 13px 'Plus Jakarta Sans', sans-serif; color: #344054; cursor: pointer">Ms</button>
<button type="button" role="radio" aria-checked="true" style="height: 38px; flex: 1 1 0; border-radius: 12px; border: 2px solid #0B1D35; background: #F1F4F9; font: 800 13px 'Plus Jakarta Sans', sans-serif; color: #0B1D35; cursor: pointer">Mrs</button>
<button type="button" role="radio" aria-checked="false" style="height: 38px; flex: 1 1 0; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; font: 700 13px 'Plus Jakarta Sans', sans-serif; color: #344054; cursor: pointer">Dr</button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; color: #5B6577">First name</span><input value="Lakshmi" autocomplete="given-name" style="width: 100%; height: 46px; border: 1.5px solid #D0D5DD; border-radius: 12px; padding: 0 12px; font: 600 14px 'Plus Jakarta Sans', sans-serif; color: #0E1726; outline: 0; min-width: 0; box-sizing: border-box"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; color: #5B6577">Middle name <span style="font-weight: 500">(optional)</span></span><input value="Devi" autocomplete="additional-name" style="width: 100%; height: 46px; border: 1.5px solid #D0D5DD; border-radius: 12px; padding: 0 12px; font: 600 14px 'Plus Jakarta Sans', sans-serif; color: #0E1726; outline: 0; min-width: 0; box-sizing: border-box"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; color: #5B6577">Last name</span><input value="Rao" autocomplete="family-name" style="width: 100%; height: 46px; border: 1.5px solid #D0D5DD; border-radius: 12px; padding: 0 12px; font: 600 14px 'Plus Jakarta Sans', sans-serif; color: #0E1726; outline: 0; min-width: 0; box-sizing: border-box"></label>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; color: #5B6577">Date of birth</span>
<span style="height: 46px; border: 2px solid #0B1D35; border-radius: 12px; padding: 0 10px 0 12px; display: flex; align-items: center; gap: 6px; box-sizing: border-box"><input value="18 Jun 1962" aria-label="Date of birth" style="border: 0; outline: 0; flex-grow: 1; font: 600 14px 'Plus Jakarta Sans', sans-serif; color: #0E1726; min-width: 0; background: transparent"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></span>
</label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; color: #5B6577">Nationality</span>
<select style="height: 46px; border: 1.5px solid #D0D5DD; border-radius: 12px; padding: 0 10px; font: 600 14px 'Plus Jakarta Sans', sans-serif; color: #0E1726; background: #FFFFFF; outline: 0; min-width: 0"><option selected>Indian</option><option>Other</option></select>
</label>
</div>
</section>
<section style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 14px; font-weight: 800; color: #0E1726">Passport</h2>
<span style="font-size: 11px; font-weight: 700; color: #5B6577">Needed for trips abroad</span>
</div>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; color: #5B6577">Passport number</span><input placeholder="e.g. N1234567" style="height: 46px; border: 1.5px solid #D0D5DD; border-radius: 12px; padding: 0 12px; font: 600 14px 'Plus Jakarta Sans', sans-serif; color: #0E1726; outline: 0; box-sizing: border-box; letter-spacing: 1px"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; color: #5B6577">Expiry date</span><input placeholder="DD MMM YYYY" style="height: 46px; border: 1.5px solid #D0D5DD; border-radius: 12px; padding: 0 12px; font: 600 14px 'Plus Jakarta Sans', sans-serif; color: #0E1726; outline: 0; min-width: 0; box-sizing: border-box"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; color: #5B6577">Issuing country</span><select style="height: 46px; border: 1.5px solid #D0D5DD; border-radius: 12px; padding: 0 10px; font: 600 14px 'Plus Jakarta Sans', sans-serif; color: #0E1726; background: #FFFFFF; outline: 0; min-width: 0"><option selected>India</option><option>Other</option></select></label>
</div>
<p style="margin: 0; font-size: 12px; line-height: 17px; color: #5B6577">It must be valid for at least 6 months after the trip ends.</p>
</section>
<button type="button" style="background: #FFFFFF; border: 0; border-radius: 16px; min-height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 10px; cursor: pointer">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<span style="flex-grow: 1; text-align: left; font: 700 14px 'Plus Jakarta Sans', sans-serif; color: #0E1726">Frequent flyer number <span style="font-weight: 500; color: #667085">(optional)</span></span>
</button>
</form>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #EAECF0; box-shadow: 0 -8px 24px rgba(7,17,31,0.08); padding: 10px 18px 20px; display: flex; flex-direction: column; gap: 10px">
<label style="display: flex; align-items: center; gap: 12px; cursor: pointer">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 800; color: #0E1726">Save to my travellers</span><span style="font-size: 12px; color: #5B6577">Fill in Lakshmi with one tap next time</span></span>
<input type="checkbox" role="switch" checked style="appearance: none; -webkit-appearance: none; width: 48px; height: 28px; border-radius: 14px; margin: 0; flex-shrink: 0; cursor: pointer; background: radial-gradient(circle at 34px 14px, #FFFFFF 10px, transparent 11px), #0B1D35">
</label>
<a href="SavedTravellers.html" style="height: 52px; border-radius: 14px; background: #0B1D35; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Add passenger</a>
</div>
</div>
</body>
</html>
