<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Flights: multi-city search</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1D35}a:hover{color:#13294A}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F9; position: relative; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column">
<header style="background: #07111F; padding: 10px 16px 76px; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0">
<div style="display: flex; align-items: center; gap: 8px; margin-left: -4px">
<a href="Home.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #13294A; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</a>
<h1 style="margin: 0; font-size: 18px; font-weight: 800; color: #FFFFFF">Search flights</h1>
</div>
<div role="tablist" aria-label="Trip type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #13294A; border-radius: 14px; padding: 4px; gap: 4px">
<button role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 11px; background: transparent; font: 700 13px 'Plus Jakarta Sans', sans-serif; color: #B7C2D3; cursor: pointer">One way</button>
<button role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 11px; background: transparent; font: 700 13px 'Plus Jakarta Sans', sans-serif; color: #B7C2D3; cursor: pointer">Round trip</button>
<button role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 11px; background: #FFFFFF; font: 800 13px 'Plus Jakarta Sans', sans-serif; color: #0B1D35; cursor: pointer">Multi-city</button>
</div>
</header>
<div style="margin: -60px 16px 0; display: flex; flex-direction: column; gap: 10px; position: relative">
<section aria-label="Flight 1" style="background: #FFFFFF; border-radius: 20px; box-shadow: 0 10px 28px rgba(7,17,31,0.12); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: #8A6A1F; letter-spacing: 0.3px"><span style="width: 22px; height: 22px; border-radius: 11px; background: #F7F0DF; display: flex; align-items: center; justify-content: center; font-size: 11px">1</span>FLIGHT 1</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button style="flex: 1 1 0; border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 1px">
<span style="font: 600 11px 'Plus Jakarta Sans', sans-serif; color: #667085">From</span>
<span style="font: 800 24px 'Plus Jakarta Sans', sans-serif; color: #0E1726; letter-spacing: -0.3px">HYD</span>
<span style="font: 500 12px 'Plus Jakarta Sans', sans-serif; color: #5B6577">Hyderabad</span>
</button>
<button aria-label="Swap from and to" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #EAECF0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4"></path><path d="M20 7H4"></path><path d="m8 21-4-4 4-4"></path><path d="M4 17h16"></path></svg>
</button>
<button style="flex: 1 1 0; border: 0; background: transparent; padding: 0; text-align: right; cursor: pointer; display: flex; flex-direction: column; align-items: flex-end; gap: 1px">
<span style="font: 600 11px 'Plus Jakarta Sans', sans-serif; color: #667085">To</span>
<span style="font: 800 24px 'Plus Jakarta Sans', sans-serif; color: #0E1726; letter-spacing: -0.3px">DEL</span>
<span style="font: 500 12px 'Plus Jakarta Sans', sans-serif; color: #5B6577">New Delhi</span>
</button>
</div>
<button style="height: 46px; border: 1px solid #EAECF0; border-radius: 12px; background: #F8F9FB; display: flex; align-items: center; gap: 10px; padding: 0 12px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
<span style="font: 700 14px 'Plus Jakarta Sans', sans-serif; color: #0E1726">Fri, 4 Dec 2026</span>
</button>
</section>
<section aria-label="Flight 2" style="background: #FFFFFF; border-radius: 20px; box-shadow: 0 4px 14px rgba(7,17,31,0.06); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: #8A6A1F; letter-spacing: 0.3px"><span style="width: 22px; height: 22px; border-radius: 11px; background: #F7F0DF; display: flex; align-items: center; justify-content: center; font-size: 11px">2</span>FLIGHT 2</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button style="flex: 1 1 0; border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 1px">
<span style="font: 600 11px 'Plus Jakarta Sans', sans-serif; color: #667085">From</span>
<span style="font: 800 24px 'Plus Jakarta Sans', sans-serif; color: #0E1726; letter-spacing: -0.3px">DEL</span>
<span style="font: 500 12px 'Plus Jakarta Sans', sans-serif; color: #5B6577">New Delhi</span>
</button>
<button aria-label="Swap from and to" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #EAECF0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4"></path><path d="M20 7H4"></path><path d="m8 21-4-4 4-4"></path><path d="M4 17h16"></path></svg>
</button>
<button style="flex: 1 1 0; border: 0; background: transparent; padding: 0; text-align: right; cursor: pointer; display: flex; flex-direction: column; align-items: flex-end; gap: 1px">
<span style="font: 600 11px 'Plus Jakarta Sans', sans-serif; color: #667085">To</span>
<span style="font: 800 24px 'Plus Jakarta Sans', sans-serif; color: #0E1726; letter-spacing: -0.3px">BOM</span>
<span style="font: 500 12px 'Plus Jakarta Sans', sans-serif; color: #5B6577">Mumbai</span>
</button>
</div>
<button style="height: 46px; border: 1px solid #EAECF0; border-radius: 12px; background: #F8F9FB; display: flex; align-items: center; gap: 10px; padding: 0 12px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
<span style="font: 700 14px 'Plus Jakarta Sans', sans-serif; color: #0E1726">Tue, 8 Dec 2026</span>
</button>
</section>
<button style="height: 50px; border: 1.5px dashed #D4AF5A; border-radius: 16px; background: #FFFCF4; display: flex; align-items: center; justify-content: center; gap: 8px; font: 800 14px 'Plus Jakarta Sans', sans-serif; color: #7A5C16; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A5C16" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Add another flight <span style="font-weight: 600; color: #8A6A1F">(up to 5)</span>
</button>
<button style="background: #FFFFFF; border: 0; border-radius: 16px; min-height: 56px; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
<span style="font: 600 11px 'Plus Jakarta Sans', sans-serif; color: #667085">Travellers and class</span>
<span style="font: 700 15px 'Plus Jakarta Sans', sans-serif; color: #0E1726">2 adults · Economy</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</button>
<div role="radiogroup" aria-label="Special fares" style="display: flex; gap: 8px; overflow: hidden">
<button role="radio" aria-checked="true" style="height: 34px; border-radius: 17px; border: 0; background: #0B1D35; color: #FFFFFF; padding: 0 12px; font: 700 12px 'Plus Jakarta Sans', sans-serif; white-space: nowrap; cursor: pointer">Regular</button>
<button role="radio" aria-checked="false" style="height: 34px; border-radius: 17px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; padding: 0 12px; font: 700 12px 'Plus Jakarta Sans', sans-serif; white-space: nowrap; cursor: pointer">Student</button>
<button role="radio" aria-checked="false" style="height: 34px; border-radius: 17px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; padding: 0 12px; font: 700 12px 'Plus Jakarta Sans', sans-serif; white-space: nowrap; cursor: pointer">Armed Forces</button>
<button role="radio" aria-checked="false" style="height: 34px; border-radius: 17px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; padding: 0 12px; font: 700 12px 'Plus Jakarta Sans', sans-serif; white-space: nowrap; cursor: pointer">Senior Citizen</button>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #EAECF0; box-shadow: 0 -8px 24px rgba(7,17,31,0.08); padding: 12px 18px 20px">
<a href="MultiCityResults.html" style="height: 54px; border-radius: 14px; background: #0B1D35; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg>
Search 2 flights
</a>
</div>
</div>
</body>
</html>
