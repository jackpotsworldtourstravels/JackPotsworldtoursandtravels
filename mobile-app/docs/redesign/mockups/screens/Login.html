<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Log in</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1D35}a:hover{color:#13294A}
input::placeholder{color:#8A94A6}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07111F; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden">
<div style="height: 318px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding-top: 18px; box-sizing: border-box">
<img src="../assets/e26196549ea1fa8342da020aae51046f.png" alt="JackpotsWorld Tours &amp; Travels" style="width: 232px; height: auto; display: block">
</div>
<form style="flex-grow: 1; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 30px 24px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; margin: 0">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 800; color: #0E1726; letter-spacing: -0.3px">Welcome back</h1>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #5B6577">Log in to see your trips, bookings and saved places.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #344054">Email or mobile number</span>
<span style="height: 52px; border: 1.5px solid #0B1D35; border-radius: 14px; display: flex; align-items: center; gap: 10px; padding: 0 14px; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
<input type="email" value="asha@example.com" aria-label="Email or mobile number" style="border: 0; outline: 0; flex-grow: 1; font: 500 15px 'Plus Jakarta Sans', sans-serif; color: #0E1726; background: transparent; min-width: 0">
</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #344054">Password</span>
<span style="height: 52px; border: 1.5px solid #D0D5DD; border-radius: 14px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
<input type="password" value="travelwell" aria-label="Password" style="border: 0; outline: 0; flex-grow: 1; font: 500 15px 'Plus Jakarta Sans', sans-serif; color: #0E1726; background: transparent; min-width: 0">
<button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</span>
</label>
<div style="display: flex; justify-content: flex-end">
<a href="#forgot" style="font-size: 13px; font-weight: 700; color: #0B1D35; text-decoration: none; padding: 4px 0">Forgot password?</a>
</div>
</div>
<a href="Verify.html" style="height: 54px; border-radius: 14px; background: #0B1D35; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; letter-spacing: 0.2px">Log in</a>
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex-grow: 1; height: 1px; background: #E4E7EC"></span>
<span style="font-size: 12px; color: #667085; font-weight: 600">OR</span>
<span style="flex-grow: 1; height: 1px; background: #E4E7EC"></span>
</div>
<a href="Verify.html" style="height: 52px; border-radius: 14px; border: 1.5px solid #D0D5DD; color: #0E1726; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"></rect><path d="M12 18h.01"></path></svg>
Log in with a one-time code
</a>
<div style="flex-grow: 1"></div>
<p style="margin: 0; text-align: center; font-size: 14px; color: #5B6577">New to JackpotsWorld? <a href="Register.html" style="font-weight: 800; color: #8A6A1F; text-decoration: none">Create an account</a></p>
<a href="Home.html" style="align-self: center; font-size: 13px; font-weight: 600; color: #667085; text-decoration: none; padding: 4px 8px">Explore first, log in later</a>
</form>
</div>
</body>
</html>
