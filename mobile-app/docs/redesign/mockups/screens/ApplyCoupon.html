<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Apply a coupon at checkout</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1D35}a:hover{color:#13294A}
input::placeholder{color:#8A94A6}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F9; position: relative; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif">
<div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
<div style="height: 112px; background: #FFFFFF; border-bottom: 1px solid #EAECF0"></div>
<div style="margin: 12px 16px 0; height: 84px; border-radius: 18px; background: #FFFFFF"></div>
<div style="margin: 12px 16px 0; height: 260px; border-radius: 18px; background: #FFFFFF"></div>
</div>
<a href="HotelReview.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(7, 17, 31, 0.6); display: block"></a>
<section role="dialog" aria-label="Apply a coupon" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -12px 40px rgba(0,0,0,0.25)">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D0D5DD"></span>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
<h1 style="margin: 0; font-size: 19px; font-weight: 800; color: #0E1726">Apply a coupon</h1>
<a href="HotelReview.html" aria-label="Close" style="width: 36px; height: 36px; border-radius: 18px; background: #F2F4F7; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</a>
</div>
<div style="display: flex; gap: 8px">
<label style="flex-grow: 1; height: 50px; border: 1.5px solid #D0D5DD; border-radius: 14px; display: flex; align-items: center; padding: 0 14px; box-sizing: border-box">
<input placeholder="Enter a coupon code" aria-label="Coupon code" style="border: 0; outline: 0; flex-grow: 1; font: 700 15px 'Plus Jakarta Sans', sans-serif; color: #0E1726; background: transparent; min-width: 0; letter-spacing: 0.5px; text-transform: uppercase">
</label>
<button style="height: 50px; border-radius: 14px; border: 1.5px solid #0B1D35; background: #FFFFFF; padding: 0 18px; font: 800 14px 'Plus Jakarta Sans', sans-serif; color: #0B1D35; cursor: pointer">Apply</button>
</div>
<div role="status" style="background: #E3F4EC; border-radius: 14px; padding: 12px; display: flex; align-items: center; gap: 10px">
<span style="width: 32px; height: 32px; border-radius: 16px; background: #0E7A55; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 800; color: #0B5A40">STAYMORE applied</span><span style="font-size: 12px; color: #0B5A40">You save ₹2,880 on this stay</span></span>
<button style="border: 0; background: transparent; min-height: 40px; padding: 0 4px; font: 800 13px 'Plus Jakarta Sans', sans-serif; color: #0B5A40; cursor: pointer">Remove</button>
</div>
<h2 style="margin: 4px 4px 0; font-size: 12px; font-weight: 800; color: #667085; letter-spacing: 0.5px">FOR THIS BOOKING</h2>
<label style="border: 2px solid #D4AF5A; background: #FFFCF4; border-radius: 16px; padding: 12px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer">
<input type="radio" name="coupon" checked style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #0B1D35; flex-shrink: 0">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 800; color: #0E1726; letter-spacing: 0.6px">STAYMORE</span><span style="font-size: 13px; color: #344054">Up to 40% off premium hotel stays</span><span style="font-size: 12px; color: #5B6577">Free breakfast included.</span></span>
<span style="font-size: 13px; font-weight: 800; color: #0E7A55; white-space: nowrap">−₹2,880</span>
</label>
<h2 style="margin: 4px 4px 0; font-size: 12px; font-weight: 800; color: #667085; letter-spacing: 0.5px">NOT FOR THIS BOOKING</h2>
<div style="border: 1px solid #EAECF0; border-radius: 16px; overflow: hidden">
<div style="padding: 12px; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid #EAECF0"><span style="font-size: 13px; font-weight: 800; color: #667085; letter-spacing: 0.6px">FLYHIGH30</span><span style="font-size: 12px; color: #5B6577">Only for domestic flights</span></div>
<div style="padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 800; color: #667085; letter-spacing: 0.6px">FAMILYFUN</span><span style="font-size: 12px; color: #5B6577">Only for holiday packages</span></div>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding-top: 6px; border-top: 1px solid #EAECF0">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 12px; color: #5B6577"><s style="color: #98A2B3">₹32,256</s> · new total</span>
<span style="font-size: 21px; font-weight: 800; color: #0E1726">₹29,376</span>
</div>
<a href="HotelReview.html" style="height: 52px; padding: 0 30px; border-radius: 14px; background: #0B1D35; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; text-decoration: none">Done</a>
</div>
</section>
</div>
</body>
</html>
