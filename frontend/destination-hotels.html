<!DOCTYPE html>
<!-- data-theme="light" for the same reason hotels.html carries it: this page
     wears main.css's light shell, and travel-explore.css's dark palette is
     keyed to :not([data-theme="light"]) so a page like this can opt out. -->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ONE PAGE, EVERY DESTINATION. Served by the /destination/{slug} route in
     app/main.py, so the URL path has a segment the document does not: at
     /destination/goa a relative "assets/css/main.css" would resolve to
     /destination/assets/css/main.css and 404, and the shared header's
     "index.html" links would point at /destination/index.html.

     <base> fixes both at once, for this page and for every link the shared
     header and footer render into it, which is why it is here rather than
     every path being rewritten by hand. -->
<base href="/">
<title>Hotels by destination — JackPots World Tours &amp; Travels</title>
<meta name="description" content="Browse hotels and stays by destination with JackPots World Tours &amp; Travels.">
<link rel="icon" href="assets/images/favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/jp-icons.css?v=20260911ic7">
<!-- The same stylesheets, in the same order, as hotels.html. hotel.css is what
     matters most: the cards this page renders are `hr-` cards, the existing
     component, not a second hotel card design. -->
<link rel="stylesheet" href="assets/css/main.css?v=20260912im1">
<link rel="stylesheet" href="assets/css/booking-card.css?v=20260911ic7">
<link rel="stylesheet" href="assets/css/account-center.css?v=20260911ic7">
<link rel="stylesheet" href="assets/css/booking.css?v=20260915mg1">
<!-- The header HeroShell mounts is the landing page's, and its layout lives
     here — without this the nav collapses onto the page content. hotels.html
     loads it for the same reason. -->
<link rel="stylesheet" href="assets/css/home-ref.css?v=20260912qt1">
<link rel="stylesheet" href="assets/css/hotel.css?v=20260912dh2">
<link rel="stylesheet" href="assets/css/profile-menu.css?v=20260911ic7">
<link rel="stylesheet" href="assets/css/site-footer.css?v=20260912ct1">
<link rel="stylesheet" href="assets/css/live-chat.css?v=20260909dg1">
<script src="shared/formatters.js"></script>
<script src="assets/js/jp-icons.js?v=20260911ic7"></script>
<script src="assets/js/auth.js?v=20260911rt1"></script>
<!-- The hotel photograph resolver and its generated manifest, in that order.
     This is the project's existing image system; nothing here builds a remote
     URL or invents a path. -->
<script src="assets/js/hotel-images.js?v=20260824ic9"></script>
<script src="assets/js/hotel-image-map.js?v=20260911ic7"></script>
<script src="assets/js/site-footer.js?v=20260911ic7"></script>
<script src="assets/js/hero-shell.js?v=20260912ct2"></script>
</head>
<body class="sp-continuation" data-sp-service="hotels" data-live-chat>
<a href="#dhMain" class="skip-link">Skip to content</a>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="assets/js/profile-menu.js?v=20260911ic7"></script>
<script src="assets/js/webrtc-call.js?v=20260909dg1"></script>
<script src="assets/js/live-chat.js?v=20260909dg1"></script>
<script src="assets/js/account-center.js?v=20260915mg1"></script>

<header id="siteHeader"></header>
<script>HeroShell.mountHeader('hotels.html');</script>

<!-- hr-scope carries hotel.css's --hr-* tokens. The cards below are that
     stylesheet's components, so they need the palette it declares there. -->
<main id="dhMain" class="dh-main hr-scope">
  <div class="wrap">

    <!-- Back to where the customer came from. A real link, not history.back():
         this page is directly linkable and arriving from a bookmark must still
         offer a way onward. -->
    <a class="dh-back" href="index.html#destinations">
      <span data-jp-icon="arrowLeft" aria-hidden="true"></span> Back to Destinations
    </a>

    <!-- THE HEADING IS EMPTY UNTIL THE API ANSWERS. Printing the slug from the
         URL as a title would mean showing "Goa" for a destination that may not
         exist, and capitalising a slug is how "vasco-da-gama" becomes
         "Vasco Da Gama". The name comes from the destination record. -->
    <!-- A <div>, NOT a <header>. The site stylesheet makes every bare `header`
         position:fixed for the navigation bar, so a semantic page header here
         was being lifted out of the flow and pinned over the real one. -->
    <div class="dh-head">
      <p class="dh-eyebrow" id="dhCountry"></p>
      <h1 class="dh-title" id="dhTitle">Loading…</h1>
      <p class="dh-lead" id="dhLead"></p>
    </div>

    <!-- Location filter chips. Rendered from the API's `locations`, so a
         destination with no locations simply has no filter row. -->
    <nav class="dh-locs" id="dhLocations" aria-label="Filter by location" hidden></nav>

    <!-- One live region for every state: loading, count, empty, error. A
         screen reader is told what happened without the grid being read out
         twice. -->
    <p class="dh-status" id="dhStatus" role="status" aria-live="polite"></p>

    <div class="hr-cards dh-grid" id="dhGrid" aria-busy="true"></div>

    <div class="dh-more-wrap"><button type="button" class="dh-more" id="dhMore" hidden></button></div>

  </div>
</main>

<footer id="bookingFooter"></footer>
<script>HeroShell.mountBookingFooter();</script>
<script src="assets/js/destination-hotels.js?v=20260912dh1"></script>
</body>
</html>
