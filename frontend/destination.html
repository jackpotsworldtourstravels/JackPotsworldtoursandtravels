<!DOCTYPE html>
<!-- Light shell, as destination-hotels.html and hotels.html. -->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ONE PAGE, EVERY DESTINATION — step two of Destination -> famous locations
     -> hotels. Served by the /destination/{slug} route in app/main.py; <base>
     is what lets its relative asset paths and the shared header's links
     resolve from /destination/goa (see destination-hotels.html for the long
     version). -->
<base href="/">
<title>Destination — JackPots World Tours &amp; Travels</title>
<meta name="description" content="Explore famous locations and find hotels near them with JackPots World Tours &amp; Travels.">
<link rel="icon" href="assets/images/favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- ONE EXTRA FAMILY, ON THESE TWO PAGES ONLY. The site is Montserrat
     throughout and stays that way; a serif is what makes a place read as a
     place rather than a record, and it is loaded where that matters instead
     of site-wide. Georgia is named as the fallback, so a blocked font request
     degrades to a serif rather than to the UI face. -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/jp-icons.css?v=20260911ic7">
<link rel="stylesheet" href="assets/css/main.css?v=20260919b2c2">
<!-- One bar and one background for the whole booking journey - the tokens
     live here and service-page.css reads them. -->
<link rel="stylesheet" href="assets/css/booking-shell.css?v=20260923bk1">
<link rel="stylesheet" href="assets/css/booking-card.css?v=20260919b2c3">
<link rel="stylesheet" href="assets/css/account-center.css?v=20260911ic7">
<link rel="stylesheet" href="assets/css/booking.css?v=20260915mg1">
<link rel="stylesheet" href="assets/css/home-ref.css?v=20260912qt1">
<link rel="stylesheet" href="assets/css/hotel.css?v=20260922loc1">
<!-- The discovery pages' own sheet. Loaded after hotel.css, which keeps the
     shared shell (.dh-main, .dh-status) those pages borrow. -->
<link rel="stylesheet" href="assets/css/discover.css?v=20260923lp3">
<link rel="stylesheet" href="assets/css/profile-menu.css?v=20260922gb3">
<link rel="stylesheet" href="assets/css/site-footer.css?v=20260912ct1">
<link rel="stylesheet" href="assets/css/live-chat.css?v=20260909dg1">
<script src="shared/formatters.js"></script>
<script src="assets/js/jp-icons.js?v=20260911ic7"></script>
<script src="assets/js/auth.js?v=20260922gs1"></script>
<!-- The destination artwork manifest the homepage shelf uses. A location's
     image key resolves against the same one; no key, no picture, a tint. -->
<script src="assets/js/destination-images.js?v=20260912im1"></script>
<!-- A photograph per famous place, keyed by the attraction id the API sends.
     Written by scripts/fetch_attraction_images.py from each landmark's own
     Wikimedia Commons category; no key, no file, no picture. -->
<script src="assets/js/location-images.js?v=20260922loc3"></script>
<script src="assets/js/site-footer.js?v=20260911ic7"></script>
<script src="assets/js/hero-shell.js?v=20260923bk1"></script>
</head>
<body class="sp-continuation disc" data-sp-service="hotels" data-live-chat>
<a href="#dlMain" class="skip-link">Skip to content</a>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="assets/js/profile-menu.js?v=20260922gs1"></script>
<script src="assets/js/webrtc-call.js?v=20260909dg1"></script>
<script src="assets/js/live-chat.js?v=20260909dg1"></script>
<script src="assets/js/account-center.js?v=20260922gs1"></script>

<header id="siteHeader"></header>
<script>HeroShell.mountHeader('hotels.html');</script>

<main id="dlMain" class="dh-main disc-main hr-scope">
  <div class="wrap">
    <a class="dh-back" href="index.html#destinations">
      <span data-jp-icon="arrowLeft" aria-hidden="true"></span> Back to Destinations
    </a>

    <!-- A <div>, not a <header>: a bare `header` is position:fixed site-wide.
         The city's own photograph goes in here once the API names it; empty
         until then, because the slug in the URL is never printed as a name. -->
    <div class="dl-hero" id="dlHero">
      <div class="dl-hero-body">
        <p class="dl-hero-eyebrow" id="dlCountry"></p>
        <h1 id="dlTitle">Loading…</h1>
        <p class="dl-hero-lead" id="dlLead"></p>
      </div>
    </div>

    <p class="dl-count" id="dlCount"></p>
    <p class="dh-status" id="dlStatus" role="status" aria-live="polite"></p>
    <div class="dl-grid" id="dlGrid" role="list" aria-busy="true"></div>
  </div>
</main>

<footer id="bookingFooter"></footer>
<script>HeroShell.mountBookingFooter();</script>
<script src="assets/js/destination.js?v=20260922teal1"></script>
</body>
</html>
