<!-- THE DESIGN SYSTEM'S HERO. No photograph: there is no verified cruise
     photography in this project, and a stock ship would be a picture of some
     other line's vessel. The night, and a voyage drawn port to port across it,
     is the honest image. The route draws itself once (jw-system.js depth()). -->
<section class="ds-hero ds-hero--compact ds-hero--plain cr-hero" aria-labelledby="crTitle">
  <svg class="ds-hero__route" viewBox="0 0 1440 500" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <path class="ghost" d="M-20 360 C 220 300, 360 420, 600 330 S 980 150, 1180 250 S 1380 330, 1460 190"/>
    <path d="M-20 360 C 220 300, 360 420, 600 330 S 980 150, 1180 250 S 1380 330, 1460 190"/>
    <circle cx="600" cy="330" r="4"/><circle cx="1180" cy="250" r="4"/>
  </svg>
  <div class="ds-grain" aria-hidden="true"></div>
  <div class="ds-container ds-hero__inner">
    <ol class="ds-crumbs"><li><a href="index.html">Home</a></li><li aria-current="page">Cruises</li></ol>
    <p class="ds-eyebrow is-light" data-ds-reveal>Cruises</p>
    <h1 class="ds-h1" id="crTitle" data-ds-reveal>Port to port, <em>by sea.</em></h1>
    <p class="ds-lede" data-ds-reveal>All-inclusive sailings from the Arabian Gulf to the Mediterranean.</p>
  </div>
</section>
