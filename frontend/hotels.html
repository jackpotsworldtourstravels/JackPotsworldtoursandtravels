<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotels — JackPots World Tours &amp; Travels</title>
<meta name="description" content="Browse hotels and resorts with JackPots World Tours &amp; Travels.">
<link rel="icon" href="assets/images/favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/jp-icons.css?v=20260824bk9">
<link rel="stylesheet" href="assets/css/service-page.css?v=20260825a">
<link rel="stylesheet" href="assets/css/account-center.css?v=20260826ac1">
<link rel="stylesheet" href="assets/css/booking.css?v=20260826rf1">
<link rel="stylesheet" href="assets/css/travel-explore.css?v=20260827hd1">
<script>try{var t=localStorage.getItem('jpc_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body data-sp-service="hotels">
<a href="#spMain" class="skip-link">Skip to content</a>

<header class="sp-header" id="spHeader"></header>

<div class="sp-hero">
  <div class="sp-wrap">
    <div class="sp-crumb"><a href="index.html">Home</a> &nbsp;›&nbsp; Hotels</div>
    <div class="sp-hero-row">
      <div>
        <h1>Hotels</h1>
        <p>Rooms and suites close to the airport and across the city, with the amenities that matter.</p>
      </div>
    </div>
    <nav class="sp-switch" aria-label="Other services">
      <a href="flights.html" data-jpi-hover><span data-jp-icon="flights"></span> Flights</a>
      <a href="hotels.html" aria-current="page" data-jpi-hover><span data-jp-icon="hotels"></span> Hotels</a>
      <a href="cruises.html" data-jpi-hover><span data-jp-icon="cruises"></span> Cruises</a>
      <a href="packages.html" data-jpi-hover><span data-jp-icon="packages"></span> Tour Packages</a>
      <a href="visa.html" data-jpi-hover><span data-jp-icon="visa"></span> Visa</a>
      <a href="activities.html" data-jpi-hover><span data-jp-icon="activities"></span> Activities</a>
    </nav>
  </div>
</div>

<main id="spMain" class="tx-scope">
  <section class="tx-section" aria-labelledby="txHotelsHead">
    <div class="tx-head">
      <div>
        <h2 id="txHotelsHead">Hotels near the airport</h2>
        <p>Rooms within a short transfer of Rajiv Gandhi International.</p>
      </div>
      <span class="tx-sample" title="Replaced automatically when the Hotel API is connected">Sample rates</span>
    </div>
    <!-- Rendered by hotel-search.js from the hotel catalogue, so the
         destination list cannot drift from what is bookable. -->
    <div class="tx-search-panel" id="txSearchPanel"></div>

    <!-- The criteria as one line, shown only once the panel above has scrolled
         away. Written by travel-explore.js from the same `state` the panel
         submits, so the two cannot disagree about what was searched. -->
    <div class="tx-summary-bar" id="txSummaryBar" aria-hidden="true"></div>

    <!-- Sort and the mobile filter button. The count line sits under it, the
         same arrangement flights.html uses, so the two results pages are one
         layout rather than two that resemble each other. -->
    <div class="tx-toolbar" id="txResults">
      <button type="button" class="tx-filter-toggle" id="txFilterToggle" aria-controls="txFilters">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
        Filters
      </button>
      <div class="tx-sort">
        <label for="txSort">Sort by</label>
        <!-- Options are written by the renderer from the data, so a sort whose
             field no property carries is never offered. -->
        <select id="txSort"></select>
      </div>
    </div>

    <div class="tx-layout">
      <!-- Filters and their counts are derived from the rows, so a new amenity
           in the API needs no markup here. -->
      <aside class="tx-filters" id="txFilters" aria-label="Filter hotels"></aside>
      <div>
        <p class="tx-count-line" id="txCount"></p>
        <div class="tx-grid" id="txHotelGrid"></div>
        <button type="button" class="tx-more" id="txHotelMore" style="display:none"></button>
      </div>
    </div>
  </section>
</main>

<footer class="sp-footer" id="spFooter"></footer>

<script src="shared/formatters.js"></script>
<!-- The Account Center, so the profile chip opens it HERE rather than
     navigating to index.html and discarding whatever is in progress.
     Loads from inside <body>: it injects its own modal markup. -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<!-- auth.js FIRST: account-center.js calls getStoredAuth() at module scope, so
     parsing it before this file left the function undefined on first load. -->
<script src="assets/js/auth.js?v=20260824ic9"></script>
<script src="assets/js/account-center.js?v=20260827fe4"></script>
<script src="components/toast.js"></script>
<!-- The vendored hotel photography map. No airline logos on this page. -->
<script src="assets/js/hotel-images.js?v=20260824ic9"></script>
<!-- The airport table travel-data.js reads. Must precede it. -->
<script src="assets/js/airports.js?v=20260825t3"></script>
<script src="assets/js/travel-data.js?v=20260827fe3"></script>
<!-- Booking layer. travel-data/booking-data are the read seams, booking-store
     the write seam; booking-flow is the engine and booking-flows the five
     product configurations. travel-explore only says WHICH item was chosen. -->
<script src="assets/js/booking-api.js?v=20260825a"></script>
<script src="assets/js/booking-data.js?v=20260824ph5a"></script>
<script src="assets/js/booking-store.js?v=20260824ph5a"></script>
<script src="assets/js/booking-flow.js?v=20260826rf8"></script>
<script src="assets/js/booking-products.js?v=20260826rf8"></script>
<script src="assets/js/booking-ticket.js?v=20260824bk9"></script>
<script src="assets/js/booking-flows.js?v=20260826rf8"></script>
<script src="assets/js/search-widgets.js?v=20260824sw2"></script>
<script src="assets/js/hotel-search.js?v=20260824bk9"></script>
<!-- The generic filter panel, then the hotel definitions that drive it. Same
     engine flights.html loads; only the definition list differs. -->
<script src="assets/js/filter-engine.js?v=20260827fe3"></script>
<script src="assets/js/hotel-filters.js?v=20260827fe3"></script>
<!-- The expanded panel and its parts. hotel-gallery.js first: hotel-details.js
     asks it whether there are photographs before rendering that section. -->
<script src="assets/js/wishlist.js?v=20260827hd1"></script>
<script src="assets/js/hotel-gallery.js?v=20260827hd1"></script>
<script src="assets/js/hotel-details.js?v=20260827hd1"></script>
<script src="assets/js/travel-explore.js?v=20260827hd1"></script>
<script src="assets/js/jp-icons.js?v=20260825a"></script>
<script src="assets/js/service-shell.js?v=20260826ac1"></script>
</body>
</html>
