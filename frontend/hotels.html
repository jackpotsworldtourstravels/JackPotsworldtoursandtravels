<!DOCTYPE html>
<!-- data-theme="light" is deliberate, and it is the same line flights.html
     carries. This page wears main.css's shell, whose palette is light by
     construction; travel-explore.css's dark palette is keyed to
     `:not([data-theme="light"])` so a page like this can opt out. Without it a
     visitor on a dark OS gets a light header, a light hero, one dark results
     band and a light footer. -->
<html lang="en" data-theme="light" data-theme-lock="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotels — JackPots World Tours &amp; Travels</title>
<meta name="description" content="Browse hotels and resorts with JackPots World Tours &amp; Travels.">
<link rel="icon" href="assets/images/favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/jp-icons.css?v=ac55704b59">
<!-- THE LANDING PAGE'S STYLESHEETS, in the landing page's order, because
     this is that page continued rather than a service page that resembles it.
     service-page.css is deliberately absent — the same call flights.html
     makes. It exists to give the standalone pages their own navy shell, and
     loading it here puts a second header design and a second palette on a page
     that already has main.css's. The --sp-* tokens booking.css, hotel.css and
     travel-explore.css ask for are bridged onto main.css's palette by
     booking-card.css, under body.sp-continuation. -->
<link rel="stylesheet" href="assets/css/main.css?v=b096349bee">
<!-- One bar and one background for the whole booking journey - the tokens
     live here and service-page.css reads them. -->
<link rel="stylesheet" href="assets/css/booking-shell.css?v=8fd75ece43">
<link rel="stylesheet" href="assets/css/booking-card.css?v=a77a0ac8f2">
<link rel="stylesheet" href="assets/css/account-center.css?v=a20dcda4b1">
<link rel="stylesheet" href="assets/css/booking.css?v=1a14f81c80">
<link rel="stylesheet" href="assets/css/payment.css?v=b6eb10f3e0">
<link rel="stylesheet" href="assets/css/travel-explore.css?v=ac4c84d6d4">
<!-- The OLD results-page SearchStrip (search-strip.css/js) is no longer loaded
     here: the hotels results card is now the shared premium BookingCard, mounted
     by travel-explore.js mountHotelCard() into #heroSearchDock, so the compact
     SearchStrip row is obsolete on this page. hotel-results.js's one reference
     to it (SearchStrip.seed) is guarded, so it simply no-ops now. -->
<!-- The landing page's search card styling, for the card's tabs/fare tiles.
     Only the CARD sections apply off the landing page - see the note at the top
     of the file. -->
<link rel="stylesheet" href="assets/css/home-ref.css?v=851dd71621">
<!-- The premium skin for the RESULTS-PAGE search card, shared by Flights,
     Hotels and Tour Packages: dresses the BookingCard rendered with
     { premium: true, results: true }. Scoped to `.search-dock`, so it skins the
     hotel card in the hero dock exactly as it does the flights one. -->
<link rel="stylesheet" href="assets/css/results-card-premium.css?v=07be02c56b">
<!-- The Hotel Results screen. Everything inside is `hr-` scoped, so it cannot
     reach Flights, the Explore band or the shared booking engine. -->
<link rel="stylesheet" href="assets/css/hotel.css?v=e51c4b10f2">
<link rel="stylesheet" href="assets/css/hotel-photo.css?v=10ad97cae4">
<!-- The profile chip + dropdown, shared by every page with a header. -->
<link rel="stylesheet" href="assets/css/profile-menu.css?v=3442d0b80a">
<!-- The company footer, one stylesheet for every page that renders it. -->
<link rel="stylesheet" href="assets/css/site-footer.css?v=86c628c5a5">
<!-- CR-9 live chat. Self-contained stylesheet (its own --lc-* tokens), so it
     renders the same on this page and inside the Account Center. -->
<link rel="stylesheet" href="assets/css/live-chat.css?v=712148e639">
<!-- The hero search card, mounted inline in the hero below. In <head> for
     the same reason flights.html puts it there: the card renders during
     parse, so everything it reads has to exist first. -->
<!-- escapeHtml, used by the shell's markup, and the icon set it mounts. -->
<script src="shared/formatters.js?v=5339f982e6"></script>
<script src="assets/js/jp-icons.js?v=4f07b31ef1"></script>
<!-- The session the header chip reflects. Must precede profile-menu.js and
     account-center.js below, both of which read it during their own start-up. -->
<script src="assets/js/auth.js?v=6d3a266434"></script>
<script src="assets/js/airports.js?v=6b21849001"></script>
<script src="assets/js/search-widgets.js?v=640796fd5b"></script>
<script src="assets/js/destinations.js?v=804e5e2739"></script>
<script src="assets/js/rooms-selector.js?v=993822a02a"></script>
<script src="assets/js/pax-selector.js?v=17e45f0e62"></script>
<script src="assets/js/search-persist.js?v=89fe7a56d0"></script>
<script src="assets/js/booking-card.js?v=0c5f35fe76"></script>
<!-- The shared header, hero and footer. In <head> because all three are
     mounted inline, during parse — the same arrangement index.html and
     flights.html use, so nothing on this page renders a frame later than it
     does over there. -->
<script src="assets/js/site-footer.js?v=11a80173ea"></script>
<script src="assets/js/hero-shell.js?v=c98f945568"></script>
<!-- THE DESIGN SYSTEM, last in <head>: its token bridge repoints the older
     palettes this page's own sheets declare, and its components (.ds-*) are
     the site's one visual language. jw-system.js is small and runs first so
     the reveal pre-states are set before the first paint. -->
<link rel="stylesheet" href="assets/css/jw-system.css?v=01bc5455b8">
<script src="assets/js/jw-system.js?v=984b118582"></script>
<script src="assets/js/jw-header.js?v=61880e4e84"></script>
<link rel="stylesheet" href="assets/css/jw-products.css?v=ead4b7e449">
<!-- The hotel journey: the stay hero, the three-zone card, the rails and
     every booking screen, recomposed in the design system. After
     jw-products.css, which is the product-page shell it builds on. -->
<link rel="stylesheet" href="assets/css/jw-hotels.css?v=2e80ed4223">
<script src="assets/js/jw-products.js?v=70d784a509" defer></script>
</head>
<body class="sp-continuation jw-prod" data-sp-service="hotels">
<a href="#spMain" class="skip-link">Skip to content</a>

<!-- The Account Center, so the profile chip opens it HERE instead of
     navigating to index.html and throwing away a half-filled booking. Must
     load from inside <body> (it injects its own markup) and BEFORE mountHeader
     below, which asks whether AccountCenter exists to decide whether the chip
     is a button or a link. Same three lines, same order, as flights.html. -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="assets/js/profile-menu.js?v=66693ec448"></script>
<script src="assets/js/notification-bell.js?v=667e8c2cf0"></script>
<script src="assets/js/webrtc-call.js?v=16e8848788"></script>
<script src="assets/js/live-chat.js?v=cd133c9bd9"></script>
<script src="assets/js/account-center.js?v=c357bb1e77"></script>

<!-- The landing page's navigation bar, from hero-shell.js. See that file's
     header for why the markup lives there and index.html keeps its own copy. -->
<header id="siteHeader"></header>
<script>HeroShell.mountHeader('hotels.html');</script>

<!-- THE LANDING PAGE'S HERO, from hero-shell.js — the same film, the same
     overlay, the same spacing and the same place for the card that index.html
     and flights.html show. It replaces a navy .sp-hero banner carrying a
     breadcrumb and a second "Hotels" title, which was the only thing making
     this page look like a different site.

     The card that arrives in it is the Hotels panel of the SAME BookingCard:
     Up to 4 Rooms, Group Deals, destination, both dates, rooms and guests.
     This page previously had no search card at all — hotel-results.js hides
     the older #txSearchPanel below and shows its compact criteria bar instead,
     so a traveller arriving from the nav bar had nothing to search with. -->
<section id="siteHero"></section>
<!-- compact: this is a RESULTS page, not the landing page. Same header,
     same film, same card - the card is this page's search summary and its
     Modify Search - but without the headline and the pitch, so the first
     result is near the top of the page instead of a screen below it.
     Searching happens on index.html; browsing happens here. -->
<script>HeroShell.mountHero({ card: 'hotels', compact: true });</script>

<main id="spMain" class="tx-scope">
  <section class="tx-section" aria-labelledby="txHotelsHead">
    <div class="tx-head">
      <div>
        <h2 id="txHotelsHead">Hotels near the airport</h2>
        <p>Rooms within a short transfer of Rajiv Gandhi International.</p>
      </div>
      <span class="tx-sample" title="Replaced automatically when the Hotel API is connected">Sample rates</span>
    </div>
    <!-- Rendered by hotel-search.js from the hotel catalogue, so the
         destination list cannot drift from what is bookable. On this screen it
         is a disclosure: hotel-results.js hides it and Modify Search reopens
         it, so the criteria bar is the resting state. -->
    <div class="tx-search-panel" id="txSearchPanel"></div>

    <div class="tx-toolbar" id="txResults"></div>

    <!-- Only rendered when the Results shell below is NOT driving the page. -->
    <div class="tx-grid" id="txHotelGrid"></div>
  </section>

  <!-- The Hotel Results screen.
       A SIBLING of .tx-section, not a child: that section is capped at 1200px
       for the Explore band's reading measure, and nesting the three-column
       layout inside it squeezed the results to 504px and left the desktop
       half empty. Out here .hr-wrap sets its own 1440px measure.
       Hidden until hotel-results.js has rows, so the page never shows an
       empty three-column frame. -->
  <div class="hr-scope" id="hrRoot" hidden>
    <div class="hr-wrap">
      <div id="hrSearchbar"></div>
      <div id="hrStepper"></div>

      <div class="hr-layout">
        <aside class="hr-rail hr-rail-filters" id="hrFilters" aria-label="Filter hotels"></aside>

        <div>
          <!-- The page's H1. jw-products.js lifts this block into the stay
               hero (ids intact), the way Flights lifts its heading into the
               journey hero; without that script it stays here. -->
          <div class="hr-results-head">
              <h1 class="hr-results-title" id="hrHeading">Hotels</h1>
              <!-- The provenance label moves here with the results. It must
                   survive the redesign: these are seeded sample rates, not
                   live supplier availability, and the screen has to say so. -->
              <span class="tx-sample" title="Replaced automatically when the Hotel API is connected">Sample rates</span>
            </div>
            <div class="hr-toolbar">
              <span class="hr-results-count" id="hrCount" aria-live="polite"></span>
              <!-- Sort chips DRIVE the select; the select is the state. -->
              <div class="hr-sortchips" id="hrSortChips" role="group" aria-label="Sort hotels"></div>
              <div class="hr-sortbar">
                <label for="hrSort">Sort by</label>
                <select id="hrSort"></select>
              </div>
              <!-- Phones and tablets: the filter rail opens as a bottom sheet. -->
              <button type="button" class="hr-filter-open" id="hrFilterOpen" aria-controls="hrFilters">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
                Filters <span class="hr-filter-n" data-count></span>
              </button>
            </div>
            <div class="hr-cards" id="hrCards" data-ds-results></div>
          </div>

        <aside class="hr-rail hr-rail-summary" id="hrSummary" aria-label="Booking summary"></aside>
      </div>
    </div>
  </div>

  <!-- The Hotel Details screen (step 3). A sibling of the Results shell rather
       than a separate page: the two swap on `?hotel=<id>` in the URL, which is
       what makes browser Back return to Results with the search still applied.
       Shares the same .hr-wrap measure and the same Booking Summary rail. -->
  <div class="hr-scope" id="hdRoot" hidden>
    <div class="hr-wrap">
      <div id="hdSearchbar"></div>
      <div id="hdStepper"></div>

      <div class="hr-hd-layout">
        <div id="hdMain"></div>
        <aside class="hr-rail hr-rail-summary" id="hdSummary" aria-label="Booking summary"></aside>
      </div>
    </div>
  </div>

  <!-- The Room Selection screen (step 4), reached at `?hotel=<id>&step=rooms`.
       Same two-column measure and the same Booking Summary rail as Details. -->
  <div class="hr-scope" id="hrmRoot" hidden>
    <div class="hr-wrap">
      <div id="hrmSearchbar"></div>
      <div id="hrmStepper"></div>

      <div class="hr-hd-layout">
        <div id="hrmMain"></div>
        <aside class="hr-rail hr-rail-summary" id="hrmSummary" aria-label="Booking summary"></aside>
      </div>
    </div>
  </div>

  <!-- The Guest Details screen (step 5), at `?hotel=<id>&step=guests`.
       Reachable only once every room has been chosen — the guest forms are
       built from the room selections. -->
  <div class="hr-scope" id="hgRoot" hidden>
    <div class="hr-wrap">
      <div id="hgSearchbar"></div>
      <div id="hgStepper"></div>

      <div class="hr-hd-layout">
        <div id="hgMain"></div>
        <aside class="hr-rail hr-rail-summary" id="hgSummary" aria-label="Booking summary"></aside>
      </div>
    </div>
  </div>

  <!-- The Review screen (step 6), at `?hotel=<id>&step=review`. A summary of
       everything the previous screens collected, plus the two things that
       belong to the booking as a whole: extras and a coupon. -->
  <div class="hr-scope" id="hvRoot" hidden>
    <div class="hr-wrap">
      <div id="hvSearchbar"></div>
      <div id="hvStepper"></div>

      <div class="hr-hd-layout">
        <div id="hvMain"></div>
        <aside class="hr-rail hr-rail-summary" id="hvSummary" aria-label="Booking summary"></aside>
      </div>
    </div>
  </div>

  <!-- The Payment screen (step 7), at `?hotel=<id>&step=payment`. No gateway is
       connected, so this collects an INTENTION and holds the booking; it draws
       no QR and asks for no card details. -->
  <div class="hr-scope" id="hpRoot" hidden>
    <div class="hr-wrap">
      <div id="hpSearchbar"></div>
      <div id="hpStepper"></div>

      <div class="hr-hd-layout">
        <div id="hpMain"></div>
        <aside class="hr-rail hr-rail-summary" id="hpSummary" aria-label="Booking summary"></aside>
      </div>
    </div>
  </div>

  <!-- The Confirmation screen (step 8), at `?step=confirmation&ref=JPH######`.
       Keyed on the reference alone and re-read from the server, so it is
       correct on a refresh and days later. -->
  <div class="hr-scope" id="hcRoot" hidden>
    <div class="hr-wrap">
      <div id="hcStepper"></div>

      <div class="hr-hd-layout">
        <div id="hcMain"></div>
        <aside class="hr-rail hr-rail-summary" id="hcSummary" aria-label="Booking summary"></aside>
      </div>
    </div>
  </div>
</main>

<div class="hr-actionbar hr-scope" id="hrActionbar" hidden></div>

<!-- The landing page's footer, from hero-shell.js — service-shell.js's
     narrow strip went with service-page.css. Rendered after the results
     markup so nothing above it waits on a footer. -->
<!-- NO FOOTER ON A RESULTS OR BOOKING PAGE. The footer is the landing
     page's — company links, contact, the newsletter — and it belongs to a
     page someone is reading, not one they are working in. It is not
     hidden here; neither the element nor the mountFooter() call exists,
     so hero-shell renders nothing. index.html keeps it. -->

<!-- axios, auth.js, profile-menu.js and account-center.js are loaded at the
     top of <body>, above the header that depends on them. -->
<script src="components/toast.js?v=88ab32edff"></script>
<!-- THE hotel photograph resolver (hotel-image-map.js, window.HotelPhoto):
     a verified photo of THIS property, else a labelled photo of the city,
     else the honest placeholder - never a different hotel. Every hotel
     screen on this page asks it, and only it. -->
<script src="assets/js/hotel-images.js?v=9c57fe59af"></script>
<script src="assets/js/hotel-image-map.js?v=ab9f3c45e4"></script>
<!-- airports.js, which travel-data.js reads, is loaded in <head> for the hero
     search card — so it already precedes this. -->
<script src="assets/js/travel-data.js?v=e760272353"></script>
<!-- Booking layer. travel-data/booking-data are the read seams, booking-store
     the write seam; booking-flow is the engine and booking-flows the five
     product configurations. travel-explore only says WHICH item was chosen. -->
<script src="assets/js/booking-api.js?v=7e4f9e4364"></script>
<script src="assets/js/booking-data.js?v=1c1bd8477a"></script>
<script src="assets/js/booking-store.js?v=f579608903"></script>
<script src="assets/js/booking-flow.js?v=558b884ff3"></script>
<script src="assets/js/jw-loader.js?v=65e9ba655f"></script>
<script src="assets/js/payment-screen.js?v=b5590c64ad"></script>
<script src="assets/js/booking-products.js?v=8c1179c798"></script>
<script src="assets/js/booking-ticket.js?v=d5ac206003"></script>
<script src="assets/js/booking-flows.js?v=a76c2af239"></script>
<!-- search-widgets.js is in <head> with the hero card, above. -->
<script src="assets/js/hotel-search.js?v=91bfd375a6"></script>
<!-- Must precede travel-explore.js: that file checks for this module and
     stands aside from rendering the hotel grid when it is present. -->
<!-- Details and Rooms must precede results.js, which routes to both. -->
<!-- The results rail. hotel-results.js asks HotelFilters for the rail's
     contents and Wishlist for its save buttons, and renders neither when they
     are missing — so these three are what keep the filters on the screen.
     filter-engine.js is the engine both product filter lists are written
     against, so it loads first. -->
<script src="assets/js/wishlist.js?v=707933cc44"></script>
<script src="assets/js/filter-engine.js?v=9fc262eb91"></script>
<script src="assets/js/hotel-filters.js?v=54e9b11784"></script>
<!-- search-strip.js removed: the obsolete SearchStrip results row is no longer
     mounted here (the premium BookingCard is the one results search card now). -->
<script src="assets/js/hotel-details.js?v=7f87c7ea41"></script>
<script src="assets/js/hotel-rooms.js?v=348321be68"></script>
<script src="assets/js/hotel-guests.js?v=79e3eb6b4b"></script>
<script src="assets/js/hotel-review.js?v=46c924638a"></script>
<script src="assets/js/hotel-payment.js?v=20b446d20c"></script>
<script src="assets/js/hotel-confirm.js?v=201aaa2ee0"></script>
<script src="assets/js/hotel-results.js?v=2301860976"></script>
<!-- The hero card renders the Hotels panel in full, Group Deals included, so
     this page needs the enquiry seam its search handler defers to. Before
     travel-explore.js, which is what calls it. -->
<script src="assets/js/group-enquiry.js?v=8c3d2bb1c6"></script>
<script src="assets/js/travel-explore.js?v=9bab848961"></script>
<!-- hero-shell.js is in <head>; the header, hero and footer are mounted
     where they sit in the document. service-shell.js is gone with
     service-page.css — it built the navy shell this page no longer wears. -->
<!-- The booking footer: Back, copyright, Privacy Policy, Terms. The
     landing page's contact footer is not rendered on these pages. -->
<footer id="bookingFooter"></footer>
<script>HeroShell.mountBookingFooter();</script>
<script src="assets/js/booking-pay.js?v=60cfd2b807"></script>
</body>
</html>
