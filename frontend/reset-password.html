<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — JackPots World Tours &amp; Travels</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/jp-login.css?v=20260803ui7">

<!-- =========================================================================
     RESET PASSWORD — the login page with a different card body.
     =========================================================================
     Same shell as Login and Forgot Password, from jpAuthShell(). The success
     state is a PANE OF THE SAME CARD rather than a fourth page, so the whole
     recovery runs without the surroundings ever changing.

     THIS PAGE USED TO SEND PEOPLE SOMEWHERE THAT NO LONGER WORKS.
     On success it redirected to login.html — the legacy customer page, which
     posts to /api/auth/user/login, an endpoint dropped in the V2 migration and
     absent from the live OpenAPI. A merchant or an admin who reset their
     password landed on a form that could not sign them in. "Go to Login" now
     returns to whichever portal the reset began from, carried in `?portal=`.

     Authentication is untouched: the same POST /api/auth/reset-password with
     {token, new_password}.
     ========================================================================= -->
</head>
<body>

<div class="jpl" id="rpShell"></div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="assets/js/jp-login.js?v=20260803ui7"></script>
<script>
'use strict';
const API_BASE = ['localhost', '127.0.0.1'].includes(location.hostname) ? 'http://127.0.0.1:8000' : '';

const JP_PORTALS = {
  merchant:    { name: 'Merchant Portal',    login: 'partner-login.html' },
  admin:       { name: 'Admin Portal',       login: 'admin/index.html' },
  super_admin: { name: 'Super Admin Portal', login: 'super-admin/index.html' },
};
const params = new URLSearchParams(location.search);
const portal = JP_PORTALS[params.get('portal')] || JP_PORTALS.merchant;
const token = params.get('token');

const RP_IDS = {
  step1: 'rpStep1', step2: 'rpStep2',
  form: 'rpForm', password: 'rpPassword', confirm: 'rpConfirm',
  submit: 'rpSubmit', msg: 'rpMsg', sub: 'rpSub',
  loginHref: portal.login,
};

document.getElementById('rpShell').innerHTML = jpAuthShell({
  portalName: portal.name,
  base: '',
  card: jplResetCard(RP_IDS),
});
jpLoginBindEyes(document.getElementById('rpShell'));

const $ = id => document.getElementById(id);

function rpMsg(el, text, kind) {
  if (!el) return;
  el.textContent = text || '';
  el.className = `msg${text ? ` ${kind || ''}` : ''}`.trim();
}

/* A link with no token cannot be completed, so say so before anything is typed
   rather than after the form is filled in and submitted. */
if (!token) {
  $(RP_IDS.sub).textContent = 'This reset link is missing its token — please request a new one.';
  $(RP_IDS.submit).disabled = true;
}

$(RP_IDS.form).addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $(RP_IDS.msg);
  const newPassword = $(RP_IDS.password).value;
  const confirmPassword = $(RP_IDS.confirm).value;

  if (!newPassword) { rpMsg(msg, 'Enter a new password.', 'error'); return; }
  if (newPassword !== confirmPassword) {
    rpMsg(msg, "Passwords don't match — please try again.", 'error');
    return;
  }

  const btn = $(RP_IDS.submit);
  btn.disabled = true;
  rpMsg(msg, 'Updating…', '');
  try {
    await axios.post(`${API_BASE}/api/auth/reset-password`, { token, new_password: newPassword });
    /* Confirmation inside the same card — see the note at the head of this file. */
    jpAuthStep('rpShell', RP_IDS.step2);
  } catch (err) {
    rpMsg(msg, jpAuthError(err,
      'Failed to reset password — the link may have expired.'), 'error');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
