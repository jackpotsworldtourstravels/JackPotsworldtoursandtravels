<!DOCTYPE html>
<!-- data-theme="light", the same line flights.html and hotels.html carry:
     this page wears main.css's shell, whose palette is light by construction,
     and travel-explore.css's dark palette is keyed to :not([data-theme="light"])
     so a page like this can opt out of it cleanly. -->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour Packages — JackPots World Tours &amp; Travels</title>
<meta name="description" content="Curated holiday and tour packages with JackPots World Tours &amp; Travels.">
<link rel="icon" href="assets/images/favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/jp-icons.css?v=20260824bk9">
<!-- THE LANDING PAGE'S STYLESHEETS, in the landing page's order - this is
     that page continued, not a service page that resembles it.
     service-page.css is deliberately absent, the same call flights.html and
     hotels.html make: it would put a second header design and a second
     palette on a page that already has main.css's. The --sp-* token names
     booking.css and travel-explore.css use are bridged onto main.css's
     palette by booking-card.css, under body.sp-continuation. -->
<link rel="stylesheet" href="assets/css/main.css?v=20260902flow4">
<link rel="stylesheet" href="assets/css/booking-card.css?v=20260902flow4">
<link rel="stylesheet" href="assets/css/account-center.css?v=20260826ac1">
<link rel="stylesheet" href="assets/css/booking.css?v=20260826rf1">
<link rel="stylesheet" href="assets/css/travel-explore.css?v=20260902flow4">
<!-- The booking progress bar, shared by Flights, Hotels and Tour Packages.
     One component so the three cannot drift apart. -->
<link rel="stylesheet" href="assets/css/payment.css?v=20260902p7">
<link rel="stylesheet" href="assets/css/booking-steps.css?v=20260902flow1">
<!-- The profile chip + dropdown, shared by every page with a header. -->
<link rel="stylesheet" href="assets/css/profile-menu.css?v=20260829pm5">
<!-- The shell and the hero search card, in <head> because the header, the
     hero and the card are all mounted inline during parse - the same
     arrangement index.html, flights.html and hotels.html use. -->
<script src="shared/formatters.js"></script>
<script src="assets/js/jp-icons.js?v=20260825a"></script>
<!-- The session the header chip reflects. Must precede profile-menu.js and
     account-center.js, both of which read it during their own start-up. -->
<script src="assets/js/auth.js?v=20260824ic9"></script>
<!-- The airport table travel-data.js reads. Must precede it. -->
<script src="assets/js/airports.js?v=20260825t3"></script>
<script src="assets/js/search-widgets.js?v=20260825t3"></script>
<script src="assets/js/destinations.js?v=20260825h1"></script>
<script src="assets/js/rooms-selector.js?v=20260825h1"></script>
<script src="assets/js/pax-selector.js?v=20260825t2"></script>
<script src="assets/js/booking-card.js?v=20260902flow4"></script>
<script src="assets/js/hero-shell.js?v=20260902flow4"></script>
</head>
<body class="sp-continuation" data-sp-service="packages">
<a href="#spMain" class="skip-link">Skip to content</a>

<!-- The Account Center, so the profile chip opens it HERE rather than
     navigating to index.html and discarding whatever is in progress. Must load
     from inside <body> (it injects its own markup) and BEFORE mountHeader,
     which asks whether AccountCenter exists to decide whether the chip is a
     button or a link. -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="assets/js/profile-menu.js?v=20260901hs1"></script>
<script src="assets/js/account-center.js?v=20260901hs1"></script>

<!-- The landing page's navigation bar, from hero-shell.js. See that file's
     header for why the markup lives there and index.html keeps its own copy. -->
<header id="siteHeader"></header>
<script>HeroShell.mountHeader('packages.html');</script>

<!-- THE LANDING PAGE'S HERO, from hero-shell.js - the same film, overlay,
     spacing and card position index.html and flights.html show, in place of a
     navy banner carrying a breadcrumb and a second "Tour Packages" title.

     The card is the Packages panel of the SAME BookingCard. The richer panel
     below (#txSearchPanel, PackageSearch) stays exactly as it was: it asks
     for budget, duration and travellers as well, and it is what this page's
     results have always been filtered by. The hero card is the quick way in,
     and both write their criteria into the same state. -->
<section id="siteHero"></section>
<!-- compact: this is a RESULTS page, not the landing page. Same header,
     same film, same card - the card is this page's search summary and its
     Modify Search - but without the headline and the pitch, so the first
     result is near the top of the page instead of a screen below it.
     Searching happens on index.html; browsing happens here. -->
<script>HeroShell.mountHero({ card: 'packages', compact: true });</script>

<main id="spMain" class="tx-scope">
  <section class="tx-section" aria-labelledby="txPkgHead">
    <div class="tx-head">
      <div>
        <h2 id="txPkgHead">Popular tour packages</h2>
        <p>Prices are per person on twin sharing and exclude visa fees.</p>
      </div>
      <span class="tx-sample" title="Replaced automatically when the Packages API is connected">Sample fares</span>
    </div>
    <!-- Rendered from the package catalogue and its real departure
         dates, so the month list cannot offer one we do not sell. -->
    <div class="tx-search-panel" id="txSearchPanel"></div>

    <!-- The booking progress, drawn by booking-steps.js — the same bar
         Flights and Hotels show, on this product's own step list. -->
    <nav class="tx-stepper" id="txStepper" aria-label="Booking progress"></nav>

    <div class="tx-toolbar" id="txResults"></div>

    <div class="tx-grid" id="txPackageGrid"></div>
  </section>
</main>

<!-- The landing page's footer, from the same shell as the header.
     service-shell.js's narrow strip went with service-page.css. -->
<footer id="siteFooter"></footer>
<script>HeroShell.mountFooter();</script>

<!-- formatters, axios, auth.js, profile-menu.js, account-center.js and the
     card's own modules are loaded above, in <head> and at the top of <body>,
     ahead of the header and hero that depend on them. -->
<script src="components/toast.js"></script>
<script src="assets/js/travel-data.js?v=20260825t3"></script>
<!-- Booking layer. travel-data/booking-data are the read seams, booking-store
     the write seam; booking-flow is the engine and booking-flows the five
     product configurations. travel-explore only says WHICH item was chosen. -->
<script src="assets/js/booking-api.js?v=20260902rz1"></script>
<script src="assets/js/booking-data.js?v=20260824ph5a"></script>
<script src="assets/js/booking-store.js?v=20260902p5"></script>
<script src="assets/js/booking-flow.js?v=20260902p2"></script>
<!-- Before booking-products.js: its payment step calls JPay.mount(). -->
<script src="assets/js/payment-screen.js?v=20260902rz1"></script>
<script src="assets/js/booking-products.js?v=20260902rz1"></script>
<script src="assets/js/booking-ticket.js?v=20260824bk9"></script>
<script src="assets/js/booking-flows.js?v=20260827p1"></script>
<!-- search-widgets.js is in <head> with the hero card, above. -->
<script src="assets/js/package-search.js?v=20260824bk9"></script>
<script src="assets/js/booking-steps.js?v=20260902flow1"></script>
<script src="assets/js/travel-explore.js?v=20260902flow4"></script>
<!-- hero-shell.js and jp-icons.js are in <head>; the header, hero and footer
     are mounted where they sit in the document. service-shell.js is gone with
     service-page.css - it built the navy shell this page no longer wears. -->
</body>
</html>
