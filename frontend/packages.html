<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- TOUR PACKAGES — steps two and three of the journey: the three shelves
     (domestic / pilgrimage / international), then the trips on the one
     chosen, then /package/{id}.

     WHAT CHANGED AND WHY. This page used to be seven tiles rendered by
     travel-explore.js with a search strip above them, filtered in the
     browser over whatever had been downloaded. It is now its own page:
     package-listing.js asks the API for the rows that match and builds the
     filter rail out of GET /packages/facets, so the controls can only offer
     choices the catalogue can satisfy - and "departs in March" is answerable
     at all, which it never was in the browser.

     gaming-packages.html is UNTOUCHED and still uses travel-explore's grid:
     that shelf is a different product with a different page, and this file
     no longer loads that module at all. -->
<title>Tour Packages — JackPots World Tours &amp; Travels</title>
<meta name="description" content="Domestic, pilgrimage and international tour packages with hotels, transfers and sightseeing arranged — JackPots World Tours &amp; Travels.">
<link rel="icon" href="assets/images/favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/main.css?v=20260925ui1">
<link rel="stylesheet" href="assets/css/booking-shell.css?v=20260923bk1">
<link rel="stylesheet" href="assets/css/booking-card.css?v=20260919b2c3">
<link rel="stylesheet" href="assets/css/account-center.css?v=20260911ic7">
<link rel="stylesheet" href="assets/css/booking.css?v=20260915mg1">
<link rel="stylesheet" href="assets/css/hotel.css?v=20260925ui1">
<link rel="stylesheet" href="assets/css/discover.css?v=20260925ui1">
<link rel="stylesheet" href="assets/css/packages.css?v=20260923pk4">
<link rel="stylesheet" href="assets/css/profile-menu.css?v=20260922gb3">
<link rel="stylesheet" href="assets/css/site-footer.css?v=20260912ct1">
<link rel="stylesheet" href="assets/css/live-chat.css?v=20260909dg1">
<script src="shared/formatters.js"></script>
<script src="assets/js/jp-icons.js?v=20260923lp2"></script>
<script src="assets/js/auth.js?v=20260922gs1"></script>
<!-- A package's image_key is a destination slug (0083 set it only where
     artwork shipped), so the cities' manifest is what resolves a card's
     photograph. A key with no file leaves the card on its tint. -->
<script src="assets/js/destination-images.js?v=20260923im2"></script>
<!-- AND the landmark photographs: a package's image_key names a city ("goa")
     or a particular place in it ("goa__fort-aguada"), so both manifests are
     consulted in that order. A heritage tour shows a fort rather than the
     same coastline as every other trip. -->
<script src="assets/js/location-images.js?v=20260923im2"></script>
<script src="assets/js/site-footer.js?v=20260911ic7"></script>
<script src="assets/js/hero-shell.js?v=20260925ui1"></script>

<body class="sp-continuation disc pk" data-sp-service="packages" data-live-chat>
<a href="#pklMain" class="skip-link">Skip to content</a>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="assets/js/profile-menu.js?v=20260922gs1"></script>
<script src="assets/js/webrtc-call.js?v=20260909dg1"></script>
<script src="assets/js/live-chat.js?v=20260909dg1"></script>
<script src="assets/js/account-center.js?v=20260922gs1"></script>

<header id="siteHeader"></header>
<script>HeroShell.mountHeader('packages.html');</script>

<!-- NO SEARCH STRIP ON THIS PAGE. It offered a destination and a month, which
     are two of the filters in the rail below - the same question asked twice,
     in two places, with two pieces of state. The site header still carries
     Flights / Hotels / Tour Packages / Gaming Packages, which is what the
     strip's tabs were for. -->
<main id="pklMain" class="dh-main disc-main pkl-main">
  <div class="wrap">
    <!-- A DIV, NOT A <header>. main.css makes every `header` element
         position:fixed - that rule is for the site bar, and a page-heading
         block written as <header> silently pinned itself over the results. -->
    <div class="pkl-head">
      <p class="pkl-eyebrow">Tour packages</p>
      <h1>Trips we have already worked out</h1>
      <p class="pkl-sub">Hotels, transfers and sightseeing arranged as one price. Choose a shelf,
        then a trip — every filter below is applied to what we actually sell.</p>
    </div>

    <!-- The three shelves. Counts are live, including the zero. -->
    <div class="pkl-tiles" id="pklTiles" role="group" aria-label="Package categories"></div>

    <p class="dh-status" id="pklStatus" role="status" aria-live="polite">Loading tour packages…</p>

    <div class="pkl-layout" id="pklLayout" hidden>
      <aside class="pkl-rail" id="pklRail" aria-label="Filters"></aside>

      <section class="pkl-results" aria-label="Tour packages">
        <div class="pkl-toolbar">
          <p class="pkl-count" id="pklCount" role="status" aria-live="polite"></p>
          <label class="pkl-sortwrap">
            <span>Sort</span>
            <select id="pklSort" class="pkl-sort"></select>
          </label>
        </div>
        <div class="pkl-grid" id="pklGrid"></div>
        <div class="pkl-empty" id="pklEmpty" hidden></div>
      </section>
    </div>
  </div>
</main>

<footer id="bookingFooter"></footer>
<script>HeroShell.mountBookingFooter();</script>
<script src="components/toast.js"></script>
<script src="assets/js/package-listing.js?v=20260923im2"></script>
</body>
</html>
