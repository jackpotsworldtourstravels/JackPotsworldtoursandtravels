<!DOCTYPE html>
<html lang="en" data-theme="light" data-theme-lock="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — JackPots World Tours &amp; Travels</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/images/favicon-180.png">
<!-- THE CUSTOMER SIGN-IN IS THE DIALOG ON THE HOME PAGE, and this address
     only forwards to it. It used to be a standalone username/password form
     that posted to /api/auth/user/login — an endpoint dropped in the V2
     migration — yet the backend still serves it at /login, so the old URL
     showed a form that could never succeed. `?signin=1` is the documented
     handoff that opens the dialog (account-center.js); `next` rides along
     untouched and app.js's returnToNext() validates it after sign-in. -->
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    q.set('signin', '1');
    location.replace('index.html?' + q.toString());
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=index.html"></noscript>
<!-- THE DESIGN SYSTEM, last in <head>: its token bridge repoints the older
     palettes this page's own sheets declare, and its components (.ds-*) are
     the site's one visual language. jw-system.js is small and runs first so
     the reveal pre-states are set before the first paint. -->
<link rel="stylesheet" href="assets/css/jw-system.css?v=05e71d2019">
<script src="assets/js/jw-system.js?v=984b118582"></script>
<script src="assets/js/jw-header.js?v=2d2da61f2f"></script>
</head>
<body>
  <p><a href="index.html?signin=1">Continue to sign in</a></p>
</body>
</html>
