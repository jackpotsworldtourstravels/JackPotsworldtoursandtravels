<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchant Login — JackPots World Tours &amp; Travels</title>
<meta name="description" content="Secure sign-in for JackPots World travel partners.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/jp-login.css?v=20260803ui9">

<!-- =========================================================================
     MERCHANT (B2B) LOGIN — the only door "My Partner" opens.
     =========================================================================
     THE LAYOUT IS NOT DEFINED HERE. It comes from jpLoginShell() in
     assets/js/jp-login.js, the same builder the Admin and Super Admin portals
     render, so all three sign-ins are one design by construction rather than by
     three files being kept in step by hand. This page supplies a title, a
     subtitle, a portal name and its element ids; everything visual lives in
     jp-login.js and assets/css/jp-login.css.

     WHAT THIS PAGE REPLACED, AND WHY IT MATTERED MORE THAN THE VISUALS.
     The public site used to send "My Partner" to portal-login.html, a hub
     advertising four doors: Super Admin, Admin, Manager and Merchant. Naming
     the internal portals on a public page is the part that was wrong. Admin,
     Manager and Super Admin are now reachable only at their own URLs.

     AUTHENTICATION IS UNCHANGED. This page drives the same three functions the
     site's modal drove — startPortalLogin('merchant') -> verifyPortalOtp() ->
     storePortalTokens('merchant') — from assets/js/auth.js, against the same
     /api/auth/* endpoints (API_CONTRACT.md §1). No endpoint, role, token
     namespace or redirect changed.

     THE OTP STEP IS NOT AN "OTP LOGIN". The brief rules out OTP/QR/social as
     ALTERNATIVE sign-in methods, and there are none here: password is the only
     way in. The code screen after it is the second factor of that one flow, and
     removing it would be modifying authentication, which the brief forbids.
     ========================================================================= -->
</head>
<body>

<div class="jpl" id="merchantAuthShell"></div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="assets/js/auth.js?v=20260803ui6"></script>
<script src="assets/js/jp-login.js?v=20260803ui8"></script>
<script>
'use strict';

/* Where a signed-in merchant belongs. Mirrors MERCHANT_PORTAL_URL in
   assets/js/app.js — the same destination from a different directory. */
const PL_PORTAL = 'merchant-classic/';

const PL_IDS = {
  stepper: 'plStepper', step1: 'plStepCreds', step2: 'plStepOtp',
  form: 'plForm', email: 'plUser', password: 'plPass', remember: 'plRemember',
  msg: 'plMsg', otp: 'plOtp', otpSub: 'plOtpSub', otpMsg: 'plOtpMsg',
  verify: 'plVerify', resend: 'plResend', back: 'plBack',
  /* Carried into the Forgot Password link so that screen wears the same portal
     name and returns here — one flow, not three unrelated pages. */
  portalKey: 'merchant',
};

jpLoginMount('merchantAuthShell', {
  title: 'Merchant Login',
  subtitle: 'Access your merchant dashboard',
  portalName: 'Merchant Portal',
  ids: PL_IDS,
  base: '',
  rememberKey: 'partner_login_remember',
});

const $ = id => document.getElementById(id);
let plChallenge = null;

function plMsg(el, text, kind) {
  if (!el) return;
  el.textContent = text || '';
  el.className = `msg${text ? ` ${kind || ''}` : ''}`.trim();
}
/* jpAuthError (jp-login.js) is shared with Forgot and Reset — including the
   429-by-status rule, which every one of those endpoints needs. */
const plErr = jpAuthError;

/* jpAuthStep is the same pane switch every other auth screen uses, so one CSS
   rule drives Login, Forgot and Reset across all three portals. */
function plStep(which) {
  jpAuthStep('merchantAuthShell', which === 'otp' ? PL_IDS.step2 : PL_IDS.step1);
  if (which === 'otp') { $(PL_IDS.otp).value = ''; $(PL_IDS.otp).focus(); }
}

/* A live partner session means there is nothing to sign in to — go straight
   through, the same short-circuit the site's modal has always had. */
if (isPartnerLoggedIn()) location.replace(PL_PORTAL);

/* Arriving from /operations/, which has no login of its own and hands off here
   with a reason. Anything unrecognised is ignored rather than echoed — this
   parameter is in a URL a third party can write. */
(function plHandoffReason() {
  const reasons = {
    'session-expired': 'Your session expired. Please sign in again.',
    'signed-out': 'You have been signed out.',
    'sign-in-required': 'Please sign in to open your workspace.',
  };
  /* `ops_reason` is the name opsRequireSignIn() actually sends; `reason` is
     accepted too so any other caller reads naturally. */
  const q = new URLSearchParams(location.search);
  const r = q.get('ops_reason') || q.get('reason');
  if (reasons[r]) plMsg($(PL_IDS.msg), reasons[r], '');
})();

$(PL_IDS.form).addEventListener('submit', async e => {
  e.preventDefault();
  const email = $(PL_IDS.email).value.trim();
  const password = $(PL_IDS.password).value;
  const msg = $(PL_IDS.msg);
  if (!email || !password) { plMsg(msg, 'Enter your email and password.', 'error'); return; }

  const btn = e.target.querySelector('.jpl-btn');
  btn.disabled = true;
  plMsg(msg, 'Checking your credentials…', '');
  try {
    /* portal:'merchant' is what makes this a partner door: the login endpoint
       refuses an account whose role does not belong to the named portal, so
       staff credentials cannot open the Merchant Portal from here. */
    const data = await startPortalLogin('merchant', email, password);
    plChallenge = data.challenge_token;
    plMsg(msg, '', '');
    plStep('otp');
    /* `message` is the server's own wording for where the code went
       (LoginChallengeResponse.message) — it knows whether SMTP delivered it or
       whether this is a dev-mode challenge, and this screen does not. */
    $(PL_IDS.otpSub).textContent = data.message || 'Enter the 6-digit code sent to your email.';
    plMsg($(PL_IDS.otpMsg), data.dev_otp ? `Dev mode — your code is ${data.dev_otp}` : '', 'success');
  } catch (err) {
    plMsg(msg, plErr(err, 'We could not sign you in. Check your details and try again.'), 'error');
  } finally {
    btn.disabled = false;
  }
});

$(PL_IDS.verify).addEventListener('click', async () => {
  const code = $(PL_IDS.otp).value.trim();
  const msg = $(PL_IDS.otpMsg);
  if (!/^\d{6}$/.test(code)) { plMsg(msg, 'Enter the 6-digit code.', 'error'); return; }

  const btn = $(PL_IDS.verify);
  btn.disabled = true;
  plMsg(msg, 'Verifying…', '');
  try {
    const data = await verifyPortalOtp(plChallenge, code);
    storePortalTokens('merchant', data);
    plMsg(msg, 'Signed in — opening your workspace…', 'success');
    location.href = PL_PORTAL;
  } catch (err) {
    plMsg(msg, plErr(err, 'That code was not accepted.'), 'error');
    btn.disabled = false;
  }
});

$(PL_IDS.otp).addEventListener('keydown', e => { if (e.key === 'Enter') $(PL_IDS.verify).click(); });

$(PL_IDS.resend).addEventListener('click', async () => {
  const msg = $(PL_IDS.otpMsg);
  plMsg(msg, 'Sending a new code…', '');
  try {
    const data = await resendPortalOtp(plChallenge);
    /* Resend issues a fresh challenge — keep the newest, or the code that
       arrives will be checked against a token that no longer applies. */
    if (data.challenge_token) plChallenge = data.challenge_token;
    plMsg(msg, data.dev_otp ? `Dev mode — your new code is ${data.dev_otp}` : 'A new code is on its way.', 'success');
  } catch (err) {
    plMsg(msg, plErr(err, 'Could not resend the code just now.'), 'error');
  }
});

$(PL_IDS.back).addEventListener('click', () => {
  plChallenge = null;
  plStep('creds');
  plMsg($(PL_IDS.msg), '', '');
  $(PL_IDS.password).value = '';
  $(PL_IDS.password).focus();
});
</script>
</body>
</html>
