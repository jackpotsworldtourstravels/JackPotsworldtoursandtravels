<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings — JackPots World Tours &amp; Travels</title>
<meta name="description" content="Your flights, hotels, cruises and tour bookings with JackPots World Tours &amp; Travels.">
<link rel="icon" href="assets/images/favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/jp-icons.css?v=20260824bk9">
<link rel="stylesheet" href="assets/css/service-page.css?v=20260829n2">
<link rel="stylesheet" href="assets/css/account-center.css?v=20260826ac1">
<link rel="stylesheet" href="assets/css/booking.css?v=20260826rf1">
<link rel="stylesheet" href="assets/css/travel-explore.css?v=20260825t1">
<script>try{var t=localStorage.getItem('jpc_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body data-sp-service="bookings">
<a href="#spMain" class="skip-link">Skip to content</a>

<header class="sp-header" id="spHeader"></header>

<div class="sp-hero">
  <div class="sp-wrap">
    <div class="sp-crumb"><a href="index.html">Home</a> &nbsp;›&nbsp; My Bookings</div>
    <h1>My Bookings</h1>
    <p>Everything you have booked, with references, tickets and cancellation.</p>
  </div>
</div>

<main id="spMain" class="tx-scope">
  <section class="tx-section" aria-labelledby="mbHead">
    <div class="tx-head">
      <div>
        <h2 id="mbHead">Your bookings</h2>
        <p id="mbCount"></p>
      </div>
      <span class="tx-sample" id="mbDemoBadge" hidden
            title="Some bookings below were made in the demo environment">Includes demo bookings</span>
    </div>

    <!-- Filled by my-bookings.js from BookingStore — the same seam the booking
         flow writes through, so any product renders from one shape. -->
    <div class="mb-tabs" id="mbTabs"></div>
    <div class="mb-list" id="mbList"></div>
  </section>
</main>

<div class="mb-overlay" id="mbOverlay" role="dialog" aria-modal="true" aria-label="Booking details"></div>

<footer class="sp-footer" id="spFooter"></footer>

<script src="shared/formatters.js"></script>
<!-- The Account Center, so the profile chip opens it HERE rather than
     navigating to index.html and discarding whatever is in progress.
     Loads from inside <body>: it injects its own modal markup. -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<!-- auth.js MUST precede account-center.js. The Account Center calls
     getStoredAuth() during its own start-up and that function is declared in
     auth.js; with auth.js second every one of those calls threw
     "getStoredAuth is not defined" and the profile panel never initialised. -->
<script src="assets/js/auth.js?v=20260824bk9"></script>
<script src="assets/js/account-center.js?v=20260829ac2"></script>
<script src="components/toast.js"></script>
<script src="assets/js/jp-icons.js?v=20260825a"></script>
<script src="assets/js/booking-api.js?v=20260902rz1"></script>
<script src="assets/js/booking-store.js?v=20260824ph5a"></script>
<script src="assets/js/booking-ticket.js?v=20260824bk9"></script>
<script src="assets/js/my-bookings.js?v=20260824bk9"></script>
<script src="assets/js/service-shell.js?v=20260826ac1"></script>
</body>
</html>
