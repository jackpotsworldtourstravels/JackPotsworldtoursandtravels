     palettes this page's own sheets declare, and its components (.ds-*) are

<body class="jw-prod mb-page" data-sp-service="bookings">

<!-- The landing page's navigation bar, from hero-shell.js. It replaces
     service-shell.js's strip, which was the last header in the product
     still listing Cruises, Visa and Activities. Mounted at the bottom of
     the page, after profile-menu.js and account-center.js. -->
<header id="siteHeader"></header>

<!-- THE COMMAND CENTRE'S HERO. The design system's night, a route drawn
     across it, and — filled by my-bookings.js from the server's bookings
     only — the next trip and four counts: upcoming, awaiting payment, past,
     cancelled. Nothing here is a demo row or a guess. -->
<section class="ds-hero ds-hero--short ds-hero--plain mb-hero" aria-labelledby="mbTitle">
  <svg class="ds-hero__route" viewBox="0 0 1440 420" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <path class="ghost" d="M-20 330 C 260 250, 420 380, 720 290 S 1160 120, 1460 170"/>
    <path d="M-20 330 C 260 250, 420 380, 720 290 S 1160 120, 1460 170"/>
  </svg>
  <div class="ds-grain" aria-hidden="true"></div>
  <div class="ds-container ds-hero__inner">
    <ol class="ds-crumbs"><li><a href="index.html">Home</a></li><li aria-current="page">My Bookings</li></ol>
    <p class="ds-eyebrow is-light" data-ds-reveal>Your travel</p>
    <h1 class="ds-h1" id="mbTitle" data-ds-reveal>My <em>journeys.</em></h1>
    <div class="mb-next" id="mbNext" hidden></div>
    <dl class="mb-stats" id="mbStats" hidden></dl>
  </div>
</section>
<main id="spMain" class="tx-scope mb-scope">
  <section class="tx-section mb-section" aria-labelledby="mbHead">
    <div class="mb-bar">
      <div>
        <h2 id="mbHead" class="mb-h2">Your bookings</h2>
        <p id="mbCount" class="mb-count" aria-live="polite"></p>
      </div>
      <!-- Status first (what needs doing), product second (what it is). -->
      <div class="ds-tabs mb-seg" id="mbSeg" aria-label="Filter by status"></div>
    </div>
    <div class="mb-tabs" id="mbTabs" role="group" aria-label="Filter by product"></div>
    <!-- Filled by my-bookings.js from the SERVER's bookings (flights, hotels,
         tour packages). Local demo rows are not listed on this page. -->
    <div class="mb-list" id="mbList" data-ds-results></div>
  </section>
</main>

<div class="mb-overlay" id="mbOverlay" role="dialog" aria-modal="true" aria-label="Booking details"></div>

<!-- The landing page's footer, from the same shell as the header. -->
<footer id="siteFooter"></footer>

<script src="shared/formatters.js?v=5339f982e6"></script>
