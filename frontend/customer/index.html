<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — JackPots World Tours &amp; Travels</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/images/favicon-180.png">
<!-- ONE CUSTOMER SIGN-IN. This page used to render its own password -> code
     form (customer-login.js). The customer sign-in is now the dialog on the
     home page — mobile or email, then a code — so this address forwards to
     it and asks to come back to the dashboard afterwards. Both share the
     jpc_access / jpc_refresh session keys, so the dashboard sees the sign-in.
     A `next` already on the URL wins; app.js only honours same-origin paths. -->
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    if (!q.get('next')) q.set('next', '/customer/dashboard.html');
    q.set('signin', '1');
    location.replace('../index.html?' + q.toString());
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../index.html"></noscript>
</head>
<body>
  <p><a href="../index.html?signin=1&amp;next=/customer/dashboard.html">Continue to sign in</a></p>
</body>
</html>
