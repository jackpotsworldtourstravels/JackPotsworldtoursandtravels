<!DOCTYPE html>
<!-- Light shell, as destination.html and destination-hotels.html. -->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ONE PAGE, EVERY FAMOUS PLACE — step three of Destination -> famous places
     -> this -> hotels. Served by the /destination/{slug}/{place} route in
     app/main.py; <base> is what lets its relative asset paths and the shared
     header's links resolve from a two-segment URL (see destination-hotels.html
     for the long version).

     NOTHING ABOUT A PARTICULAR PLACE IS IN THIS FILE. The photograph, the
     name, the city, the description, the fares and the other places to see
     all arrive from GET /api/customer/destinations/{dest}/attractions/{slug},
     so a landmark added through the catalogue has a page the same day. -->
<base href="/">
<title>Places to visit — JackPots World Tours &amp; Travels</title>
<meta name="description" content="Famous places to visit, what a trip costs and hotels nearby, with JackPots World Tours &amp; Travels.">
<link rel="icon" href="assets/images/favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- ONE EXTRA FAMILY, ON THESE TWO PAGES ONLY. The site is Montserrat
     throughout and stays that way; a serif is what makes a place read as a
     place rather than a record, and it is loaded where that matters instead
     of site-wide. Georgia is named as the fallback, so a blocked font request
     degrades to a serif rather than to the UI face. -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/jp-icons.css?v=20260911ic7">
<link rel="stylesheet" href="assets/css/main.css?v=20260922fp3">
<!-- One bar and one background for the whole booking journey - the tokens
     live here and service-page.css reads them. -->
<link rel="stylesheet" href="assets/css/booking-shell.css?v=20260923bk1">
<link rel="stylesheet" href="assets/css/booking-card.css?v=20260919b2c3">
<link rel="stylesheet" href="assets/css/account-center.css?v=20260911ic7">
<link rel="stylesheet" href="assets/css/booking.css?v=20260915mg1">
<link rel="stylesheet" href="assets/css/home-ref.css?v=20260922fp3">
<link rel="stylesheet" href="assets/css/hotel.css?v=20260922loc1">
<!-- The discovery pages' own sheet. Loaded after hotel.css, which keeps the
     shared shell (.dh-main, .dh-status) those pages borrow. -->
<link rel="stylesheet" href="assets/css/discover.css?v=20260923lp1">
<link rel="stylesheet" href="assets/css/profile-menu.css?v=20260922gb3">
<link rel="stylesheet" href="assets/css/site-footer.css?v=20260912ct1">
<link rel="stylesheet" href="assets/css/live-chat.css?v=20260909dg1">
<script src="shared/formatters.js"></script>
<script src="assets/js/jp-icons.js?v=20260923lp1"></script>
<script src="assets/js/auth.js?v=20260922gs1"></script>
<!-- The photographs of the famous places, vendored from Wikimedia Commons by
     scripts/fetch_attraction_images.py. A KEY the API sends is looked up here;
     a key with no file, or no key at all, leaves the card on its artwork. -->
<script src="assets/js/location-images.js?v=20260922loc3"></script>
<!-- The hotel shelf's artwork, for the three cards under "Hotels near".
     Same contract again: a key the API sends, resolved through a shipped
     manifest, never a path built from a name. -->
<script src="assets/js/hotel-images.js?v=20260912im1"></script>
<script src="assets/js/site-footer.js?v=20260911ic7"></script>
<script src="assets/js/hero-shell.js?v=20260923bk1"></script>
</head>
<body class="sp-continuation disc" data-sp-service="hotels" data-live-chat>
<a href="#lpMain" class="skip-link">Skip to content</a>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="assets/js/profile-menu.js?v=20260922gs1"></script>
<script src="assets/js/webrtc-call.js?v=20260909dg1"></script>
<script src="assets/js/live-chat.js?v=20260909dg1"></script>
<script src="assets/js/account-center.js?v=20260922gs1"></script>

<header id="siteHeader"></header>
<script>HeroShell.mountHeader('hotels.html');</script>

<main id="lpMain" class="dh-main disc-main hr-scope">
  <div class="wrap">
    <!-- The href is rewritten by location.js once the API says which
         destination this is. It is a link to the destinations shelf until
         then, so it is never a control that goes nowhere. -->
    <a class="dh-back" id="lpBack" href="index.html#destinations">
      <span data-jp-icon="arrowLeft" aria-hidden="true"></span> <span id="lpBackText">Back to Destinations</span>
    </a>

    <p class="dh-status" id="lpStatus" role="status" aria-live="polite">Loading this place…</p>

    <!-- THE HERO IS THE PHOTOGRAPH, full width, with the place named on it. It
         sits OUTSIDE the content column so it can break out of it; everything
         below stays in the column. Every strip inside it — the trail, the
         badge, the one-line description, the photo count, the map link, the
         gallery button — is hidden until the API answer proves it has
         something to put there, so the hero never carries an empty control. -->
    <article class="lp" id="lpBody" hidden>
      <div class="lp-hero" id="lpHero">
        <div class="lp-hero-body">
          <nav class="lp-crumbs" id="lpCrumbs" aria-label="Breadcrumb" hidden></nav>
          <p class="lp-badge" id="lpBadge" hidden></p>
          <h1 id="lpTitle"></h1>
          <p class="lp-lead" id="lpLead" hidden></p>
          <div class="lp-hero-meta" id="lpHeroMeta" hidden>
            <span class="lp-chip" id="lpShots" hidden></span>
            <a class="lp-chip lp-chip-act" id="lpMapLink" hidden target="_blank" rel="noopener noreferrer"></a>
            <button type="button" class="lp-chip lp-chip-act" id="lpGalleryBtn" hidden></button>
          </div>
        </div>
      </div>

      <!-- Each section removes itself when it has nothing true to say, rather
           than printing an empty heading. -->
      <section class="lp-sec" id="lpFaresSec">
        <h2 class="disc-h2">Fare details</h2>
        <p class="disc-sub">What it costs to travel here, from what we have on the shelf.</p>
        <div class="lp-fares" id="lpFares"></div>
        <p class="lp-note" id="lpFareNote"></p>
      </section>

      <!-- The information strip: best time, how long to stay, what the place
           is known for, who it suits. Editorial columns (migration 0080), so
           the whole strip stays hidden until somebody fills them in. -->
      <section class="lp-sec" id="lpQuickSec" hidden>
        <div class="lp-quick" id="lpQuick"></div>
      </section>

      <section class="lp-sec" id="lpAboutSec" hidden>
        <h2 class="disc-h2" id="lpAboutH"></h2>
        <div class="lp-about-grid">
          <div class="lp-card lp-about-card">
            <div class="lp-about" id="lpAbout"></div>
            <button type="button" class="lp-more-btn" id="lpReadMore" hidden aria-expanded="false">Read more</button>
          </div>
          <aside class="lp-card lp-facts" id="lpFacts" hidden>
            <h3 class="lp-facts-h">Good to know</h3>
            <dl id="lpFactsList"></dl>
          </aside>
        </div>
      </section>

      <section class="lp-sec" id="lpHotelsSec">
        <div class="lp-hotels-head">
          <div>
            <h2 class="disc-h2" id="lpHotelsH"></h2>
            <p class="disc-sub" id="lpHotelsLine"></p>
          </div>
          <a class="disc-btn" id="lpHotelsBtn" href="#">
            View Hotels <span data-jp-icon="arrowRight" aria-hidden="true"></span>
          </a>
        </div>
        <div class="lp-hotels" id="lpHotels"></div>
      </section>

      <section class="lp-sec" id="lpMoreSec" hidden>
        <div class="lp-hotels-head">
          <div>
            <h2 class="disc-h2" id="lpMoreH">Top attractions nearby</h2>
            <p class="disc-sub" id="lpMoreLine"></p>
          </div>
          <a class="disc-btn disc-btn-ghost" id="lpMoreAll" href="#">
            See all <span data-jp-icon="arrowRight" aria-hidden="true"></span>
          </a>
        </div>
        <div class="lp-more" id="lpMore" role="list"></div>
      </section>

      <section class="lp-sec" id="lpPlanSec" hidden>
        <h2 class="disc-h2">Plan your visit</h2>
        <div class="lp-plan" id="lpPlan"></div>
      </section>

      <section class="lp-sec" id="lpGallerySec" hidden>
        <h2 class="disc-h2" id="lpGalleryH">Explore in pictures</h2>
        <p class="disc-sub" id="lpGalleryLine"></p>
        <div class="lp-gallery" id="lpGallery" role="list" tabindex="0" aria-label="Photographs of this place"></div>
      </section>
    </article>
  </div>
</main>

<footer id="bookingFooter"></footer>
<script>HeroShell.mountBookingFooter();</script>
<script src="assets/js/location.js?v=20260923lp1"></script>
</body>
</html>
