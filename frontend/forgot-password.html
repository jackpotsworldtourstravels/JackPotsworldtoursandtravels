<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — JackPots World Tours &amp; Travels</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/jp-login.css?v=20260803ui10">

<!-- =========================================================================
     FORGOT PASSWORD — the login page with a different card body.
     =========================================================================
     Same shell as every other authentication screen: same photograph, logo,
     welcome copy, service strip, feature row, card frame, support block and
     footer, all from jpAuthShell(). Only the contents of the white card differ.
     That is the whole point — someone who clicks "Forgot Password?" should feel
     the page changed its mind, not that they left the product.

     ONE PAGE SERVES ALL THREE PORTALS, because the endpoint does.
     /api/auth/forgot-password takes an email and nothing else — there is no
     `portal` field to send, and an address identifies its own account. So
     rather than three near-identical files, `?portal=` decides only which name
     appears on the left and where "Back to Login" returns to. An unknown or
     absent value falls back to the partner login, which is the likeliest
     visitor and the only one linked publicly.

     THERE IS NO OTP STEP HERE, and that is the backend's design rather than an
     omission: this endpoint mails a tokenised LINK, and reset-password.html
     exchanges {token, new_password}. No endpoint exists that would verify a
     code in this flow, so a code screen would be a form with nothing to submit
     to. Adding one would mean changing authentication.
     ========================================================================= -->
</head>
<body>

<div class="jpl" id="fpShell"></div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="assets/js/jp-login.js?v=20260803ui8"></script>
<script>
'use strict';
const API_BASE = ['localhost', '127.0.0.1'].includes(location.hostname) ? 'http://127.0.0.1:8000' : '';

/* Which portal's branding to wear, and where "Back to Login" goes. Naming the
   internal portals in this map is safe: this page is only ever reached FROM one
   of them, and it advertises nothing on its own. */
const JP_PORTALS = {
  merchant:    { name: 'Merchant Portal',    login: 'partner-login.html' },
  admin:       { name: 'Admin Portal',       login: 'admin/index.html' },
  super_admin: { name: 'Super Admin Portal', login: 'super-admin/index.html' },
};
const portalKey = new URLSearchParams(location.search).get('portal');
const portal = JP_PORTALS[portalKey] || JP_PORTALS.merchant;

const FP_IDS = {
  step1: 'fpStep1', step2: 'fpStep2',
  form: 'fpForm', email: 'fpEmail', msg: 'fpMsg',
  sentSub: 'fpSentSub', sentMsg: 'fpSentMsg',
  loginHref: portal.login,
};

document.getElementById('fpShell').innerHTML = jpAuthShell({
  portalName: portal.name,
  base: '',
  card: jplForgotCard(FP_IDS),
});

const $ = id => document.getElementById(id);

function fpMsg(el, text, kind) {
  if (!el) return;
  el.textContent = text || '';
  el.className = `msg${text ? ` ${kind || ''}` : ''}`.trim();
}

$(FP_IDS.form).addEventListener('submit', async e => {
  e.preventDefault();
  const email = $(FP_IDS.email).value.trim();
  const msg = $(FP_IDS.msg);
  if (!email) { fpMsg(msg, 'Enter your registered email address.', 'error'); return; }

  const btn = e.target.querySelector('.jpl-btn');
  btn.disabled = true;
  fpMsg(msg, 'Sending…', '');
  try {
    const { data } = await axios.post(`${API_BASE}/api/auth/forgot-password`, { email });

    /* The confirmation is a PANE OF THIS CARD, not a new page — the brief asks
       for one seamless flow, and navigating away is what breaks that. */
    jpAuthStep('fpShell', FP_IDS.step2);

    if (data.reset_link) {
      /* Debug mode returns the link instead of mailing it. The API hands back a
         bare "/reset-password?token=…" path because it does not know this is a
         static site, so the page name is rebuilt here. */
      const token = new URL(data.reset_link, location.origin).searchParams.get('token');
      $(FP_IDS.sentSub).textContent = 'Email delivery is not configured, so the reset link is shown here.';
      $(FP_IDS.sentMsg).innerHTML =
        `<a class="jpl-forgot" href="reset-password.html?token=${encodeURIComponent(token)}`
        + `&amp;portal=${encodeURIComponent(portalKey || 'merchant')}">Reset your password →</a>`;
      $(FP_IDS.sentMsg).className = 'msg';
    } else if (data.message) {
      /* The server's own wording. It deliberately does not confirm whether the
         address exists, so echoing it rather than writing our own keeps this
         from becoming an account-enumeration oracle. */
      fpMsg($(FP_IDS.sentMsg), data.message, '');
    }
  } catch (err) {
    fpMsg(msg, jpAuthError(err, 'Something went wrong — please try again.'), 'error');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
