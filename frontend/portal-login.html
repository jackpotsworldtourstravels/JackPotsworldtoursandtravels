<!-- =========================================================================
     THE PORTAL DIRECTORY IS RETIRED. This page is a redirect now.
     =========================================================================
     It used to render four cards — Super Admin, Admin, Manager, Merchant —
     each naming an internal portal and linking to it. It sat at a public URL
     with no session required, which made it a published index of the
     platform's internal entrances. That is what was wrong with it; the visual
     design was beside the point.

     The audiences are now split at the front door:

       * Public site "Login"  -> Customer (B2C).
       * Public site "My Partner" -> partner-login.html, Merchant (B2B) only.
       * Admin / Manager / Super Admin -> their own URLs (admin/, manager/,
         super-admin/), which staff already hold and which are named nowhere
         a visitor can reach.

     WHY A REDIRECT AND NOT A DELETION. This URL was linked from the public
     header for months, so it is in bookmarks and browser histories. Deleting
     the file turns every one of those into a 404; redirecting lands a merchant
     — much the likeliest visitor — on the login they were looking for. Staff
     bookmarks pointed at the portals themselves, not at this hub, so nobody
     loses a route they were actually using.

     `replace` rather than `href`: the hub must not sit in the back-stack, or
     Back from the login returns here and bounces forward again.
     ========================================================================= -->
<script>
  location.replace('partner-login.html' + location.search);
</script>

</body>
