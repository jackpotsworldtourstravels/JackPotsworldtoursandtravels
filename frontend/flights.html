<!DOCTYPE html>
<!-- data-theme="light" is deliberate, not a leftover.

     This page wears the LANDING PAGE's shell now — main.css, whose palette is
     light by construction and which contains no prefers-color-scheme block at
     all. travel-explore.css's dark palette is keyed to `:not([data-theme=
     "light"])` precisely so a page like this can opt out: without it a visitor
     on a dark OS got a light header, a light hero, one dark results band and a
     light footer, which is worse than no dark mode. -->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flights — JackPots World Tours &amp; Travels</title>
<meta name="description" content="Search and compare flight departures with JackPots World Tours &amp; Travels.">
<link rel="icon" type="image/png" href="assets/images/favicon-180.png">
<link rel="icon" href="assets/images/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- THE SAME STYLESHEETS THE LANDING PAGE LOADS, in the same order, because
     this is that page continued rather than a service page that resembles it.
     service-page.css is deliberately absent: it exists to give the standalone
     hotels/cruises/packages pages their own navy shell, and loading it here
     would put a second header design and a second palette on the page. The
     handful of --sp-* tokens booking.css still asks for are bridged onto
     main.css's palette in booking-card.css. -->
<link rel="stylesheet" href="assets/css/jp-icons.css?v=20260824bk9">
<link rel="stylesheet" href="assets/css/main.css?v=20260902flow4">
<link rel="stylesheet" href="assets/css/booking-card.css?v=20260902flow4">
<link rel="stylesheet" href="assets/css/booking.css?v=20260826rf1">
<!-- The flight booking screens, built to the supplied reference. Every rule
     inside is scoped to .bk-sheet.is-flight, so the other four products keep
     booking.css exactly as it is. -->
<link rel="stylesheet" href="assets/css/booking-ref.css?v=20260826rf7">
<link rel="stylesheet" href="assets/css/travel-explore.css?v=20260902flow4">
<!-- The booking progress bar, shared by Flights, Hotels and Tour Packages.
     One component so the three cannot drift apart. -->
<link rel="stylesheet" href="assets/css/booking-steps.css?v=20260902flow1">
<!-- The profile chip + dropdown, shared by every page that shows a header. -->
<link rel="stylesheet" href="assets/css/profile-menu.css?v=20260827pm1">

<!-- Loaded in <head> because the header and the card are mounted inline,
     during parse — the same trick index.html uses, so nothing on this page
     renders a frame later than it does over there. -->
<script src="shared/formatters.js"></script>
<script src="assets/js/auth.js?v=20260827pm2"></script>
<script src="assets/js/jp-icons.js?v=20260825t1"></script>
<!-- The airport picker: the table and the shared listbox. airports.js also has
     to precede travel-data.js further down, which reads the same table. -->
<script src="assets/js/airports.js?v=20260825t3"></script>
<script src="assets/js/search-widgets.js?v=20260825t3"></script>
<script src="assets/js/destinations.js?v=20260825h1"></script>
<script src="assets/js/rooms-selector.js?v=20260825h1"></script>
<script src="assets/js/pax-selector.js?v=20260825t2"></script>
<script src="assets/js/booking-card.js?v=20260902flow4"></script>
<script src="assets/js/hero-shell.js?v=20260902flow4"></script>
</head>
<body class="sp-continuation" data-sp-service="flights">
<a href="#txResults" class="skip-link">Skip to results</a>

<!-- The Account Center, so the profile chip opens it HERE instead of navigating
     to index.html and throwing away a half-filled booking. Must load from inside
     <body> (it injects its own markup) and BEFORE mountHeader below, which asks
     whether AccountCenter exists to decide if the chip is a button or a link. -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="assets/js/profile-menu.js?v=20260827dup1"></script>
<script src="assets/js/account-center.js?v=20260829pm6"></script>

<!-- The landing page's navigation bar, from hero-shell.js. See that file's
     header for why the markup lives there and index.html keeps its own copy. -->
<header id="siteHeader"></header>
<script>HeroShell.mountHeader('flights.html');</script>

<main id="main">
<!-- THE LANDING PAGE'S HERO, not a copy of it. Same film, same overlay, same
     spacing, same place for the card — built by hero-shell.js, which is what
     Hotels and Tour Packages mount too. The only thing this page chooses is
     which product's card opens in the dock.

     It used to be 25 lines duplicated from index.html. Two hand-kept copies of
     a hero drift, and the whole point of this page is that arriving here from
     a Search click should not feel like a page change at all. -->
<section id="siteHero"></section>
<!-- compact: this is a RESULTS page, not the landing page. Same header,
     same film, same card - the card is this page's search summary and its
     Modify Search - but without the headline and the pitch, so the first
     result is near the top of the page instead of a screen below it.
     Searching happens on index.html; browsing happens here. -->
<script>HeroShell.mountHero({ card: 'flights', compact: true });</script>

<div class="tx-scope">
  <section class="tx-section" aria-labelledby="txFlightsHead">
    <div class="tx-head">
      <div>
        <h2 id="txFlightsHead">Departures</h2>
        <!-- Written by the renderer from the criteria and the data's own date;
             typing it here produced "Fri, 08 Aug" against cards that said Sat. -->
        <p id="txFlightsSub">Non-stop services across India, the Gulf and South-East Asia.</p>
      </div>
      <span class="tx-sample" title="Replaced automatically when the Flight API is connected">Sample schedule</span>
    </div>

    <!-- The booking progress. This screen is step 2 of 7 — the traveller has
         searched and is choosing a flight; everything after Book Now is the
         booking flow proper. Rendered by travel-explore.js so the labels and
         the current step live in one place. -->
    <nav class="tx-stepper" id="txStepper" aria-label="Booking progress"></nav>

    <div class="tx-toolbar" id="txResults">
      <div class="tx-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label for="txSearch" class="sr-only">Search flights</label>
        <input id="txSearch" type="search" placeholder="Search flight number, airline or city…" autocomplete="off">
      </div>
      <button type="button" class="tx-filter-toggle" id="txFilterToggle" aria-controls="txFilters">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
        Filters
      </button>
      <div class="tx-sort">
        <label for="txSort">Sort by</label>
        <select id="txSort">
          <option value="dep-asc">Earliest departure</option>
          <option value="dep-desc">Latest departure</option>
          <option value="airline">Airline</option>
        </select>
      </div>
    </div>

    <!-- THREE COLUMNS: filters, the flights, the booking summary. The rail on
         the right is the running answer to "what am I booking and what will it
         cost", which is the question a traveller is holding the whole time they
         read the list. It is a SIBLING of the list, not part of it, so neither
         one scrolls the other. -->
    <div class="tx-layout tx-layout-3">
      <!-- The COLUMN, and the sticky panel inside it. A `position:sticky` box
           can only travel inside its own containing block, so the panel cannot
           be the grid item as well: the item is exactly as tall as the panel,
           which leaves nothing to travel through and the panel simply scrolls
           away. The column stretches to the row, the panel sticks within it.
           Facets and their counts are derived from the data, so a new airline
           in the API needs no markup here. -->
      <aside class="tx-rail-col" aria-label="Filter flights">
        <div class="tx-filters" id="txFilters"></div>
      </aside>
      <div class="tx-results-col">
        <p class="tx-count-line" id="txCount"></p>
        <div id="txFlightList"></div>
        <button type="button" class="tx-more" id="txMore" style="display:none;"></button>
      </div>
      <aside class="tx-summary-rail" id="txSummary" aria-label="Booking summary"></aside>
    </div>
  </section>
</div>
</main>

<footer id="siteFooter"></footer>

<script>
  /* Rendered after the results markup so nothing above it waits on a footer. */
  HeroShell.mountFooter();
</script>

<script src="components/toast.js"></script>
<script src="assets/js/airline-logos.js?v=20260824ic9"></script>
<script src="assets/js/travel-data.js?v=20260827fe3"></script>
<!-- Booking layer. travel-data/booking-data are the read seams, booking-store
     the write seam; booking-flow is the engine and booking-flows the five
     product configurations. travel-explore only says WHICH item was chosen. -->
<script src="assets/js/booking-api.js?v=20260902rz1"></script>
<script src="assets/js/booking-data.js?v=20260824ph5a"></script>
<script src="assets/js/booking-store.js?v=20260902p5"></script>
<script src="assets/js/booking-flow.js?v=20260902p2"></script>
<script src="assets/js/booking-products.js?v=20260902rz1"></script>
<script src="assets/js/booking-ticket.js?v=20260824bk9"></script>
<script src="assets/js/booking-flows.js?v=20260827p1"></script>
<!-- No search panel is loaded down here: the hero card IS this page's search
     panel, so a second set of criteria controls below the fold would be two
     places to type the same trip into. search-widgets.js is loaded in <head>,
     above, because the card's airport picker is built from it. -->
<!-- This page renders the Hotels panel too, Group Deals included, so it needs
     the enquiry seam its search handler defers to. Before travel-explore.js,
     which is what calls it. -->
<script src="assets/js/group-enquiry.js?v=20260827g2"></script>
<!-- The results-page filter engine. Before travel-explore.js, which mounts it.
     Carries every filter definition; the sidebar renders only the ones the
     current results can actually answer. -->
<!-- The generic panel: options, counts, collapsing, the slider, focus, URL.
     Knows nothing about flights; flight-filters.js supplies the definitions. -->
<script src="assets/js/filter-engine.js?v=20260827fe3"></script>
<script src="assets/js/flight-filters.js?v=20260827fe3"></script>
<script src="assets/js/booking-steps.js?v=20260902flow1"></script>
<script src="assets/js/travel-explore.js?v=20260902flow4"></script>
</body>
</html>
