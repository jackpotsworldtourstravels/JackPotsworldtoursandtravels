<!DOCTYPE html>
<!-- data-theme="light" is deliberate, not a leftover.

     This page wears the LANDING PAGE's shell now — main.css, whose palette is
     light by construction and which contains no prefers-color-scheme block at
     all. travel-explore.css's dark palette is keyed to `:not([data-theme=
     "light"])` precisely so a page like this can opt out: without it a visitor
     on a dark OS got a light header, a light hero, one dark results band and a
     light footer, which is worse than no dark mode. -->
<html lang="en" data-theme="light" data-theme-lock="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flights — JackPots World Tours &amp; Travels</title>
<meta name="description" content="Search and compare flight departures with JackPots World Tours &amp; Travels.">
<link rel="icon" type="image/png" href="assets/images/favicon-180.png">
<link rel="icon" href="assets/images/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- THE SAME STYLESHEETS THE LANDING PAGE LOADS, in the same order, because
     this is that page continued rather than a service page that resembles it.
     service-page.css is deliberately absent: it exists to give the standalone
     hotels/cruises/packages pages their own navy shell, and loading it here
     would put a second header design and a second palette on the page. The
     handful of --sp-* tokens booking.css still asks for are bridged onto
     main.css's palette in booking-card.css. -->
<link rel="stylesheet" href="assets/css/jp-icons.css?v=ac55704b59">
<link rel="stylesheet" href="assets/css/main.css?v=b096349bee">
<!-- One bar and one background for the whole booking journey - the tokens
     live here and service-page.css reads them. -->
<link rel="stylesheet" href="assets/css/booking-shell.css?v=8fd75ece43">
<link rel="stylesheet" href="assets/css/booking-card.css?v=a77a0ac8f2">
<link rel="stylesheet" href="assets/css/booking.css?v=1a14f81c80">
<link rel="stylesheet" href="assets/css/payment.css?v=b6eb10f3e0">
<!-- The flight booking screens, built to the supplied reference. Every rule
     inside is scoped to .bk-sheet.is-flight, so the other four products keep
     booking.css exactly as it is. -->
<link rel="stylesheet" href="assets/css/booking-ref.css?v=09007466e3">
<link rel="stylesheet" href="assets/css/travel-explore.css?v=ac4c84d6d4">
<!-- The results-page search strip. A separate component from the landing
     page's booking card; index.html loads neither of these two files. -->
<link rel="stylesheet" href="assets/css/search-strip.css?v=4689237d96">
<!-- The landing page's search card, for the strip's Modify button: it opens
     BookingCard underneath the row, and the reference styling for that card
     (tabs, fare tiles) lives here. Only the CARD sections apply
     off the landing page - see the note at the top of the file. -->
<link rel="stylesheet" href="assets/css/home-ref.css?v=851dd71621">
<!-- The JackpotsWorld palette for this page, and the two components the
     reference asks for that no other product has: the date strip and the
     offers strip. LAST of the stylesheets on purpose - it repoints the
     --tx-*/--sp-* tokens the four above declare, so it has to be read after
     them. Every rule inside is scoped to body[data-sp-service="flights"], so
     hotels.html and packages.html (which share these same stylesheets) are
     untouched. -->
<link rel="stylesheet" href="assets/css/flights-ref.css?v=4cb50a322c">
<!-- The premium skin for the RESULTS-PAGE search card, shared by Flights,
     Hotels and Tour Packages: dresses the BookingCard rendered with
     { premium: true, results: true }. Scoped to `.search-dock` (the hero dock
     every results page shares); the landing page uses `.cine-dock`, so it is
     untouched. See the file header. -->
<link rel="stylesheet" href="assets/css/results-card-premium.css?v=07be02c56b">
<!-- The profile chip + dropdown, shared by every page that shows a header. -->
<link rel="stylesheet" href="assets/css/profile-menu.css?v=3442d0b80a">
<!-- The company footer, one stylesheet for every page that renders it. -->
<link rel="stylesheet" href="assets/css/site-footer.css?v=86c628c5a5">
<!-- CR-9 live chat. Self-contained stylesheet (its own --lc-* tokens), so it
     renders the same on this page and inside the Account Center. -->
<link rel="stylesheet" href="assets/css/live-chat.css?v=3eb1615f9d">

<!-- Loaded in <head> because the header and the card are mounted inline,
     during parse — the same trick index.html uses, so nothing on this page
     renders a frame later than it does over there. -->
<script src="shared/formatters.js?v=5339f982e6"></script>
<script src="assets/js/auth.js?v=6d3a266434"></script>
<script src="assets/js/jp-icons.js?v=4f07b31ef1"></script>
<!-- The airport picker: the table and the shared listbox. airports.js also has
     to precede travel-data.js further down, which reads the same table. -->
<script src="assets/js/airports.js?v=6b21849001"></script>
<script src="assets/js/search-widgets.js?v=640796fd5b"></script>
<script src="assets/js/destinations.js?v=804e5e2739"></script>
<script src="assets/js/rooms-selector.js?v=993822a02a"></script>
<script src="assets/js/pax-selector.js?v=17e45f0e62"></script>
<script src="assets/js/search-persist.js?v=89fe7a56d0"></script>
<script src="assets/js/booking-card.js?v=0c5f35fe76"></script>
<script src="assets/js/site-footer.js?v=11a80173ea"></script>
<script src="assets/js/hero-shell.js?v=c98f945568"></script>
<!-- THE DESIGN SYSTEM, last in <head>: its token bridge repoints the older
     palettes this page's own sheets declare, and its components (.ds-*) are
     the site's one visual language. jw-system.js is small and runs first so
     the reveal pre-states are set before the first paint. -->
<link rel="stylesheet" href="assets/css/jw-system.css?v=01bc5455b8">
<script src="assets/js/jw-system.js?v=984b118582"></script>
<script src="assets/js/jw-header.js?v=61880e4e84"></script>
<link rel="stylesheet" href="assets/css/jw-products.css?v=ead4b7e449">
<script src="assets/js/jw-products.js?v=70d784a509" defer></script>
<!-- The page's one dropdown list: replaces the browser's popup on Cabin,
     Sort by and the booking forms' selects, and dresses the airport list and
     the Travellers popover to match. The <select>s stay the real controls. -->
<link rel="stylesheet" href="assets/css/jw-select.css?v=cb1e15259b">
<script src="assets/js/jw-select.js?v=d0c3fb28bb" defer></script>
</head>
<body class="sp-continuation jw-prod" data-sp-service="flights">
<a href="#txResults" class="skip-link">Skip to results</a>

<!-- The Account Center, so the profile chip opens it HERE instead of navigating
     to index.html and throwing away a half-filled booking. Must load from inside
     <body> (it injects its own markup) and BEFORE mountHeader below, which asks
     whether AccountCenter exists to decide if the chip is a button or a link. -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="assets/js/profile-menu.js?v=66693ec448"></script>
<script src="assets/js/notification-bell.js?v=667e8c2cf0"></script>
<script src="assets/js/webrtc-call.js?v=16e8848788"></script>
<script src="assets/js/live-chat.js?v=3660608d28"></script>
<script src="assets/js/account-center.js?v=c357bb1e77"></script>

<!-- The landing page's navigation bar, from hero-shell.js. See that file's
     header for why the markup lives there and index.html keeps its own copy. -->
<header id="siteHeader"></header>
<script>HeroShell.mountHeader('flights.html');</script>

<main id="main">
<!-- THE LANDING PAGE'S HERO, not a copy of it. Same film, same overlay, same
     spacing, same place for the card — built by hero-shell.js, which is what
     Hotels and Tour Packages mount too. The only thing this page chooses is
     which product's card opens in the dock.

     It used to be 25 lines duplicated from index.html. Two hand-kept copies of
     a hero drift, and the whole point of this page is that arriving here from
     a Search click should not feel like a page change at all. -->
<section id="siteHero"></section>
<!-- compact: this is a RESULTS page, not the landing page. Same header,
     same film, same card - the card is this page's search summary and its
     Modify Search - but without the headline and the pitch, so the first
     result is near the top of the page instead of a screen below it.
     Searching happens on index.html; browsing happens here. -->
<script>HeroShell.mountHero({ card: 'flights', compact: true });</script>

<div class="tx-scope">
  <section class="tx-section" aria-labelledby="txFlightsHead">
    <div class="tx-head">
      <div>
        <h1 id="txFlightsHead">Departures</h1>
        <!-- Written by the renderer from the criteria and the data's own date;
             typing it here produced "Fri, 08 Aug" against cards that said Sat. -->
        <p id="txFlightsSub">Non-stop services across India, the Gulf and South-East Asia.</p>
      </div>
      <span class="tx-sample" title="Replaced automatically when the Flight API is connected">Sample schedule</span>
    </div>

    <!-- THE DATE STRIP. Written by travel-explore.js from the searched date;
         a cell re-runs the search for its own day through the same path the
         search strip's button uses. It carries a fare ONLY for a date whose
         results are actually loaded — this application has no date-level fare
         feed, and a row of plausible prices beside real flight numbers would
         read as quotes. See renderDateStrip(). -->
    <div id="fxDates"></div>

    <div class="tx-toolbar" id="txResults">
      <div class="tx-search">
        <i data-jp-icon="search" class="jpi-field"></i>
        <label for="txSearch" class="sr-only">Search flights</label>
        <input id="txSearch" type="search" placeholder="Search flight number, airline or city…" autocomplete="off">
      </div>
      <!-- Filled by renderDirectToggle() only when the results carry a Stops
           filter to drive. It is that sidebar checkbox, not a second one. -->
      <span id="fxDirect"></span>
      <button type="button" class="tx-filter-toggle" id="txFilterToggle" aria-controls="txFilters">
        <i data-jp-icon="slidersHorizontal" class="jpi-filter"></i>
        Filters
      </button>
      <div class="tx-sort">
        <label for="txSort">Sort by</label>
        <select id="txSort">
          <option value="dep-asc">Earliest departure</option>
          <option value="dep-desc">Latest departure</option>
          <option value="airline">Airline</option>
        </select>
      </div>
    </div>

    <!-- THREE COLUMNS: filters, the flights, the booking summary. The rail on
         the right is the running answer to "what am I booking and what will it
         cost", which is the question a traveller is holding the whole time they
         read the list. It is a SIBLING of the list, not part of it, so neither
         one scrolls the other. -->
    <div class="tx-layout tx-layout-3">
      <!-- The COLUMN, and the sticky panel inside it. A `position:sticky` box
           can only travel inside its own containing block, so the panel cannot
           be the grid item as well: the item is exactly as tall as the panel,
           which leaves nothing to travel through and the panel simply scrolls
           away. The column stretches to the row, the panel sticks within it.
           Facets and their counts are derived from the data, so a new airline
           in the API needs no markup here. -->
      <aside class="tx-rail-col" aria-label="Filter flights">
        <div class="tx-filters" id="txFilters"></div>
      </aside>
      <div class="tx-results-col">
        <!-- Real coupons from GET /api/customer/coupons, or nothing at all.
             Empty until that call answers, and left empty when the table has
             no active flight coupon — the one thing this strip must never do
             is invent a discount. See renderOffers(). -->
        <div id="fxOffers"></div>
        <p class="tx-count-line" id="txCount"></p>
        <div id="txFlightList" data-ds-results></div>
        <button type="button" class="tx-more" id="txMore" style="display:none;"></button>
      </div>
      <aside class="tx-summary-rail" id="txSummary" aria-label="Booking summary"></aside>
    </div>
  </section>
</div>
</main>

<!-- NO FOOTER ON A RESULTS OR BOOKING PAGE. The footer is the landing
     page's — company links, contact, the newsletter — and it belongs to a
     page someone is reading, not one they are working in. It is not
     hidden here; neither the element nor the mountFooter() call exists,
     so hero-shell renders nothing. index.html keeps it. -->

<script src="components/toast.js?v=88ab32edff"></script>
<script src="assets/js/airline-logos.js?v=91b70534e4"></script>
<script src="assets/js/travel-data.js?v=e760272353"></script>
<!-- Booking layer. travel-data/booking-data are the read seams, booking-store
     the write seam; booking-flow is the engine and booking-flows the five
     product configurations. travel-explore only says WHICH item was chosen. -->
<script src="assets/js/booking-api.js?v=7e4f9e4364"></script>
<script src="assets/js/booking-data.js?v=1c1bd8477a"></script>
<script src="assets/js/booking-store.js?v=f579608903"></script>
<script src="assets/js/booking-flow.js?v=558b884ff3"></script>
<script src="assets/js/jw-loader.js?v=65e9ba655f"></script>
<script src="assets/js/payment-screen.js?v=b5590c64ad"></script>
<script src="assets/js/booking-products.js?v=8c1179c798"></script>
<script src="assets/js/booking-ticket.js?v=d5ac206003"></script>
<script src="assets/js/booking-flows.js?v=a76c2af239"></script>
<!-- No search panel is loaded down here: the hero card IS this page's search
     panel, so a second set of criteria controls below the fold would be two
     places to type the same trip into. search-widgets.js is loaded in <head>,
     above, because the card's airport picker is built from it. -->
<!-- This page renders the Hotels panel too, Group Deals included, so it needs
     the enquiry seam its search handler defers to. Before travel-explore.js,
     which is what calls it. -->
<script src="assets/js/group-enquiry.js?v=8c3d2bb1c6"></script>
<!-- The results-page filter engine. Before travel-explore.js, which mounts it.
     Carries every filter definition; the sidebar renders only the ones the
     current results can actually answer. -->
<!-- The generic panel: options, counts, collapsing, the slider, focus, URL.
     Knows nothing about flights; flight-filters.js supplies the definitions. -->
<script src="assets/js/filter-engine.js?v=9fc262eb91"></script>
<script src="assets/js/flight-filters.js?v=03160c31ce"></script>
<script src="assets/js/search-strip.js?v=6814f53913"></script>
<script src="assets/js/travel-explore.js?v=9bab848961"></script>
<!-- The booking footer: Back, copyright, Privacy Policy, Terms. The
     landing page's contact footer is not rendered on these pages. -->
<footer id="bookingFooter"></footer>
<script>HeroShell.mountBookingFooter();</script>
<script src="assets/js/booking-pay.js?v=60cfd2b807"></script>
</body>
</html>
