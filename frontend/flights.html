<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flights — JackPots World Tours &amp; Travels</title>
<meta name="description" content="Search and compare flight departures with JackPots World Tours &amp; Travels.">
<link rel="icon" href="assets/images/favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/jp-icons.css?v=20260824bk9">
<link rel="stylesheet" href="assets/css/service-page.css?v=20260824bk9">
<link rel="stylesheet" href="assets/css/booking.css?v=20260824bk11">
<link rel="stylesheet" href="assets/css/travel-explore.css?v=20260824bk9">
<!-- Applied BEFORE first paint. Without this a stored dark choice arrives only
     after service-shell.js runs and the page flashes light on the way. -->
<script>try{var t=localStorage.getItem('jpc_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body data-sp-service="flights">
<a href="#spMain" class="skip-link">Skip to content</a>

<header class="sp-header" id="spHeader"></header>

<div class="sp-hero">
  <div class="sp-wrap">
    <div class="sp-crumb"><a href="index.html">Home</a> &nbsp;›&nbsp; Flights</div>
    <div class="sp-hero-row">
      <div>
        <h1>Flights</h1>
        <p>Compare departures by airline, time and destination, then book in a couple of taps.</p>
      </div>
    </div>
    <nav class="sp-switch" aria-label="Other services">
      <a href="flights.html" aria-current="page" data-jpi-hover><span data-jp-icon="flights"></span> Flights</a>
      <a href="hotels.html" data-jpi-hover><span data-jp-icon="hotels"></span> Hotels</a>
      <a href="cruises.html" data-jpi-hover><span data-jp-icon="cruises"></span> Cruises</a>
      <a href="packages.html" data-jpi-hover><span data-jp-icon="packages"></span> Tour Packages</a>
      <a href="visa.html" data-jpi-hover><span data-jp-icon="visa"></span> Visa</a>
      <a href="activities.html" data-jpi-hover><span data-jp-icon="activities"></span> Activities</a>
    </nav>
  </div>
</div>

<main id="spMain" class="tx-scope">
  <section class="tx-section" aria-labelledby="txFlightsHead">
    <div class="tx-head">
      <div>
        <h2 id="txFlightsHead">Today's departures from Hyderabad</h2>
        <!-- Written by the renderer from the data's own date; typing it here
             produced "Fri, 08 Aug" against cards that said Sat. -->
        <p id="txFlightsSub">Non-stop services across India, the Gulf and South-East Asia.</p>
      </div>
      <span class="tx-sample" title="Replaced automatically when the Flight API is connected">Sample schedule</span>
    </div>

    <!-- Step 1 of the booking journey. Rendered by travel-explore.js from
         TravelData.airports so the airport list cannot drift from the data. -->
    <div class="tx-search-panel" id="txSearchPanel"></div>

    <div class="tx-toolbar" id="txResults">
      <div class="tx-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label for="txSearch" class="sr-only">Search flights</label>
        <input id="txSearch" type="search" placeholder="Search flight number, airline or city…" autocomplete="off">
      </div>
      <button type="button" class="tx-filter-toggle" id="txFilterToggle" aria-controls="txFilters">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
        Filters
      </button>
      <div class="tx-sort">
        <label for="txSort">Sort by</label>
        <select id="txSort">
          <option value="dep-asc">Earliest departure</option>
          <option value="dep-desc">Latest departure</option>
          <option value="airline">Airline</option>
        </select>
      </div>
    </div>

    <div class="tx-layout">
      <!-- Facets and their counts are derived from the data, so a new airline
           in the API needs no markup here. -->
      <aside class="tx-filters" id="txFilters" aria-label="Filter flights"></aside>
      <div>
        <p class="tx-count-line" id="txCount"></p>
        <div id="txFlightList"></div>
        <button type="button" class="tx-more" id="txMore" style="display:none;"></button>
      </div>
    </div>
  </section>
</main>

<footer class="sp-footer" id="spFooter"></footer>

<script src="shared/formatters.js"></script>
<script src="components/toast.js"></script>
<script src="assets/js/auth.js?v=20260824ic9"></script>
<script src="assets/js/airline-logos.js?v=20260824ic9"></script>
<script src="assets/js/travel-data.js?v=20260824bk9"></script>
<!-- Booking layer. travel-data/booking-data are the read seams, booking-store
     the write seam; booking-flow is the engine and booking-flows the five
     product configurations. travel-explore only says WHICH item was chosen. -->
<script src="assets/js/booking-api.js?v=20260824bk9"></script>
<script src="assets/js/booking-data.js?v=20260824bk9"></script>
<script src="assets/js/booking-store.js?v=20260824bk9"></script>
<script src="assets/js/booking-flow.js?v=20260824bk11"></script>
<script src="assets/js/booking-products.js?v=20260824bk11"></script>
<script src="assets/js/booking-ticket.js?v=20260824bk9"></script>
<script src="assets/js/booking-flows.js?v=20260824bk11"></script>
<script src="assets/js/search-widgets.js?v=20260824sw2"></script>
<script src="assets/js/flight-search.js?v=20260824bk9"></script>
<script src="assets/js/travel-explore.js?v=20260824bk9"></script>
<script src="assets/js/jp-icons.js?v=20260824bk9"></script>
<script src="assets/js/service-shell.js?v=20260824bk9"></script>
</body>
</html>
