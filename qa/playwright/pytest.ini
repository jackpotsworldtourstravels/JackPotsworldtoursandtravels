[pytest]
# Playwright QA suite — isolated from backend/tests (which runs on SQLite in CI).
# Run from qa/playwright:  python -m pytest
# Artifacts (screenshots/traces/videos on failure) land in qa/playwright/artifacts.
addopts =
    -ra
    --browser=chromium
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=artifacts
    -m "not leak"
# Default deselection: `leak`-marked specs are intentional worst-case leak DEMOS that
# FAIL on purpose (see e2e/journeys/test_force_fail.py). A bare `pytest` run excludes
# them so an ordinary run is never red; an explicit `-m e2e` (CI) also excludes them
# (they are not `e2e`); run them deliberately with `-m leak`.
# NOTE (Stage 4B.1 security): standalone --video is intentionally omitted. The
# retained trace already embeds an equivalent screencast (viewable in the trace
# viewer), so a separate video.webm is redundant — and it is the one artifact the
# pre-upload sanitizer (qa/scripts/sanitize_artifacts.py) cannot inspect. Dropping
# it shrinks the artifact and removes an un-scrubbable stream without losing replay.
testpaths = .
# markers are registered in conftest.pytest_configure
