[pytest]
# Playwright QA suite — isolated from backend/tests (which runs on SQLite in CI).
# Run from qa/playwright:  python -m pytest
# Artifacts (screenshots/traces/videos on failure) land in qa/playwright/artifacts.
addopts =
    -ra
    --browser=chromium
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --video=retain-on-failure
    --output=artifacts
testpaths = .
# markers are registered in conftest.pytest_configure
