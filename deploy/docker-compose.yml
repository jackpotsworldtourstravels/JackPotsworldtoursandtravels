# Production stack for a single EC2 instance: the app, and Caddy in front of it
# for TLS. Postgres is deliberately absent — it lives in RDS, so that a rebuilt
# instance costs nothing but downtime.
#
#   cd deploy && docker compose up -d --build
#
# Two files must exist first, neither of them in git:
#   ../backend/.env   application settings (DATABASE_URL, JWT_SECRET_KEY, S3_*)
#   ./.env            SITE_DOMAIN, read by Caddy for the certificate
#
# See docs/AWS_DEPLOYMENT.md for how to produce both.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../backend/.env
    environment:
      # Set HERE and not only in backend/.env, deliberately. Forgetting it is
      # not a visible failure: the app falls back to an in-process broker and
      # chat half-works across the two gunicorn workers, delivering roughly
      # half of all messages to nobody with no error anywhere. `environment`
      # overrides `env_file`, so this cannot be lost by editing .env either.
      REDIS_URL: redis://redis:6379/0
      # The commit this container was built from, exported by redeploy.sh and
      # reported at /api/version. Without it there is no way to ask a RUNNING
      # deployment what code it is running — and "is it actually deployed?"
      # has already been answered wrongly once here, from output that looked
      # healthy but described the previous build.
      APP_COMMIT: ${APP_COMMIT:-unknown}
    restart: unless-stopped
    # No ports mapping: the app is reachable only through Caddy, on the
    # compose network. Publishing 8000 to the host would expose an untrusted
    # plaintext port to anything the security group happens to allow.
    expose:
      - "8000"
    volumes:
      # Matters only when STORAGE_BACKEND=local, where it is the difference
      # between keeping and losing customer documents on a container rebuild.
      # With s3 it holds nothing but a scratch file mid-upload.
      - app_uploads:/app/uploads
    healthcheck:
      # The entrypoint runs migrations before serving, so a slow first boot is
      # normal; start_period covers it without marking the container unhealthy.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # CR-9: the chat fan-out. `service_healthy`, not just `service_started` —
    # the app reads REDIS_URL on first use, and a Redis that is listening but
    # not yet answering turns the first chat connection into an error the
    # customer sees.
    depends_on:
      redis:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Live chat fan-out (CR-9)
  # ---------------------------------------------------------------------------
  # WHY THIS SERVICE EXISTS: the app runs WEB_CONCURRENCY=2, so gunicorn forks
  # two processes with separate memory. A chat connection registry held in
  # Python is therefore per-process — a customer on worker 1 and an agent on
  # worker 2 never see each other, and about half of all messages are delivered
  # to nobody with no error raised anywhere. Redis is the shared channel that
  # makes one publish reach both workers.
  #
  # NOT PUBLISHED TO THE HOST. Reachable only on the compose network, like the
  # app itself. Redis has no authentication here and does not need any, because
  # nothing outside this network can open a socket to it.
  #
  # NO PERSISTENCE, DELIBERATELY. Everything in it — pub/sub traffic, one-time
  # WebSocket tickets, presence keys — is worthless a minute after it is
  # written. An AOF file would be a backup liability with no recovery value,
  # and `allkeys-lru` means a memory spike drops the oldest ephemera rather
  # than refusing writes.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", "",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volumes, not bind mounts: these hold the issued certificate and
      # its private key. Losing them on a rebuild means re-issuing, and Let's
      # Encrypt rate-limits that to five per week per domain.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: *logging

volumes:
  app_uploads:
  caddy_data:
  caddy_config:
