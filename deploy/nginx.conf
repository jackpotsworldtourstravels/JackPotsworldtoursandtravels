# /etc/nginx/sites-available/jackpots — reverse proxy + static file host.
# Replace YOUR_DOMAIN with your actual domain (e.g. jackpotsworldtours.com) before deploying.
# After certbot runs, it will rewrite this file to add the TLS server block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/jackpots;
    index index.html;

    location /assets/ {
        alias /var/www/jackpots/assets/;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
